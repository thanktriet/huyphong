<!DOCTYPE html>
<html>
<head>
    <title>Generate PWA Icons</title>
</head>
<body>
    <h1>Generate PWA Icons</h1>
    <p>Click the buttons below to generate icons. Then right-click and save each image.</p>
    
    <canvas id="icon192" width="192" height="192" style="border: 1px solid #ccc; margin: 10px;"></canvas>
    <canvas id="icon512" width="512" height="512" style="border: 1px solid #ccc; margin: 10px;"></canvas>
    
    <div>
        <button onclick="generateIcon(192)">Generate 192x192</button>
        <button onclick="generateIcon(512)">Generate 512x512</button>
        <button onclick="downloadIcon(192)">Download 192x192</button>
        <button onclick="downloadIcon(512)">Download 512x512</button>
    </div>
    
    <script>
        function generateIcon(size) {
            const canvas = document.getElementById(`icon${size}`);
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#2563eb';
            ctx.fillRect(0, 0, size, size);
            
            // Draw a simple dumbbell icon
            ctx.fillStyle = '#ffffff';
            const centerX = size / 2;
            const centerY = size / 2;
            const barWidth = size * 0.4;
            const barHeight = size * 0.1;
            const weightSize = size * 0.15;
            
            // Bar
            ctx.fillRect(centerX - barWidth/2, centerY - barHeight/2, barWidth, barHeight);
            
            // Left weight
            ctx.beginPath();
            ctx.arc(centerX - barWidth/2, centerY, weightSize/2, 0, Math.PI * 2);
            ctx.fill();
            
            // Right weight
            ctx.beginPath();
            ctx.arc(centerX + barWidth/2, centerY, weightSize/2, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function downloadIcon(size) {
            const canvas = document.getElementById(`icon${size}`);
            const link = document.createElement('a');
            link.download = `icon-${size}x${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // Generate on load
        window.onload = () => {
            generateIcon(192);
            generateIcon(512);
        };
    </script>
</body>
</html>
