<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Simple Login Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .result {
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
        }
        .success { background: #d1fae5; border-left: 4px solid #10b981; }
        .error { background: #fee2e2; border-left: 4px solid #ef4444; }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔐 Simple Login Test</h1>
    
    <div id="result" class="result">Ready to test...</div>
    
    <button onclick="testDirectLogin()">Test Direct Login (Không dùng API wrapper)</button>
    <button onclick="testWithAPI()">Test với API Wrapper</button>

    <script>
        const SUPABASE_URL = 'https://opjagtkygfgiokuaveje.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wamFndGt5Z2ZnaW9rdWF2ZWplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUxNTc3NzgsImV4cCI6MjA4MDczMzc3OH0.Hoembak7nFXUQ4ZhETnvJg2OETkPibkU1YJbxlrqKtM';

        async function testDirectLogin() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Testing direct login...';
            resultEl.className = 'result';

            try {
                if (!window.supabase) {
                    resultEl.textContent = '❌ Supabase library chưa load';
                    resultEl.className = 'result error';
                    return;
                }

                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                // Test login trực tiếp (check password trong users table)
                const { data: user, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('email', 'student1@test.com')
                    .eq('password', '123456')
                    .single();

                if (error) {
                    resultEl.innerHTML = `❌ Error: ${error.message}`;
                    resultEl.className = 'result error';
                } else if (!user) {
                    resultEl.innerHTML = '❌ User not found';
                    resultEl.className = 'result error';
                } else {
                    // Format response giống API
                    const expiryDate = user.expiry_date 
                        ? new Date(user.expiry_date).toLocaleDateString('vi-VN')
                        : '---';

                    resultEl.innerHTML = `
                        ✅ Login Success!<br><br>
                        <strong>User Info:</strong><br>
                        ID: ${user.id}<br>
                        Name: ${user.name}<br>
                        Role: ${user.role}<br>
                        Sessions: ${user.session_left || 0}<br>
                        Expiry: ${expiryDate}<br><br>
                        <pre>${JSON.stringify({
                            success: true,
                            user: {
                                id: user.id,
                                name: user.name,
                                role: user.role,
                                sessionLeft: user.session_left || 0,
                                expiryDate: expiryDate
                            }
                        }, null, 2)}</pre>
                    `;
                    resultEl.className = 'result success';
                }
            } catch (e) {
                resultEl.innerHTML = `❌ Exception: ${e.message}`;
                resultEl.className = 'result error';
                console.error(e);
            }
        }

        async function testWithAPI() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Loading API...';
            resultEl.className = 'result';

            try {
                // Load config
                if (!window.supabaseClient) {
                    const configScript = document.createElement('script');
                    configScript.src = 'config-supabase.js';
                    document.head.appendChild(configScript);
                    await new Promise((resolve, reject) => {
                        configScript.onload = () => setTimeout(resolve, 500);
                        configScript.onerror = () => reject(new Error('Config load failed'));
                        setTimeout(() => reject(new Error('Config load timeout')), 5000);
                    });
                }

                // Load API
                const apiScript = document.createElement('script');
                apiScript.src = 'supabase/api.js';
                document.head.appendChild(apiScript);
                await new Promise((resolve, reject) => {
                    apiScript.onload = () => setTimeout(resolve, 500);
                    apiScript.onerror = () => reject(new Error('API load failed'));
                    setTimeout(() => reject(new Error('API load timeout')), 5000);
                });

                // Wait for API
                let retries = 0;
                while (!window.supabaseAPI && retries < 20) {
                    await new Promise(r => setTimeout(r, 100));
                    retries++;
                }

                if (!window.supabaseAPI) {
                    resultEl.innerHTML = '❌ supabaseAPI không load được. Kiểm tra file supabase/api.js';
                    resultEl.className = 'result error';
                    return;
                }

                if (!window.supabaseAPI.login) {
                    resultEl.innerHTML = '❌ supabaseAPI.login không tồn tại. Kiểm tra file supabase/api.js';
                    resultEl.className = 'result error';
                    return;
                }

                resultEl.textContent = 'Testing login with API...';
                const result = await window.supabaseAPI.login('student1@test.com', '123456');

                if (result.success) {
                    resultEl.innerHTML = `
                        ✅ Login Success với API!<br><br>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                    resultEl.className = 'result success';
                } else {
                    resultEl.innerHTML = `❌ Login Failed: ${result.message}`;
                    resultEl.className = 'result error';
                }
            } catch (e) {
                resultEl.innerHTML = `❌ Error: ${e.message}<br><br>Check browser console for details.`;
                resultEl.className = 'result error';
                console.error('API test error:', e);
            }
        }

        // Auto test direct login on load
        window.addEventListener('load', () => {
            setTimeout(testDirectLogin, 1000);
        });
    </script>
</body>
</html>
