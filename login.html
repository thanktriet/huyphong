<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Huy Phong Fitness</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/mobile.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        @media (max-width: 640px) {
            input, button { font-size: 16px; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-blue-50 h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-blue-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-96 h-96 bg-indigo-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
    </div>

    <div class="glass-effect p-8 md:p-10 rounded-3xl shadow-2xl w-full max-w-[400px] border border-white/50 relative z-10 transform transition-all hover:scale-[1.01]">
        
        <div class="text-center mb-8">
            <div class="relative inline-block">
                <div class="absolute inset-0 bg-blue-500 rounded-full blur opacity-40"></div>
                <div class="relative bg-gradient-to-br from-blue-600 to-indigo-600 w-20 h-20 rounded-2xl rotate-3 flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <i data-lucide="dumbbell" class="w-10 h-10 text-white -rotate-3"></i>
                </div>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">HUY PHONG</h1>
            <p class="text-blue-600 text-xs font-bold uppercase tracking-[0.2em] mt-1">Fitness & Performance</p>
        </div>

        <form id="loginForm" class="space-y-5">
            
            <div class="group">
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Đăng Nhập</label>
                <div class="relative transition-all duration-300">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="mail" class="h-5 w-5 text-slate-400 group-focus-within:text-blue-500 transition-colors"></i>
                    </div>
                    <input type="email" id="email" 
                        class="w-full pl-10 pr-4 py-3.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-700 text-sm focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all duration-300 placeholder-slate-400 shadow-sm" 
                        placeholder="tenhocvien" required>
                </div>
            </div>

            <div class="group">
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Mật khẩu</label>
                <div class="relative transition-all duration-300">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="lock" class="h-5 w-5 text-slate-400 group-focus-within:text-blue-500 transition-colors"></i>
                    </div>
                    <input type="password" id="password" 
                        class="w-full pl-10 pr-4 py-3.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-700 text-sm focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all duration-300 placeholder-slate-400 shadow-sm" 
                        placeholder="••••••" required>
                </div>
            </div>

            <button type="submit" id="btn" 
                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-500/30 transform hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 flex items-center justify-center gap-2 group">
                <span>Đăng Nhập Ngay</span>
                <i data-lucide="arrow-right" class="w-5 h-5 group-hover:translate-x-1 transition-transform"></i>
            </button>

            <div id="msg" class="hidden transform transition-all duration-300">
                <div class="bg-red-50 border border-red-100 text-red-500 text-sm rounded-lg p-3 flex items-center justify-center gap-2">
                    <i data-lucide="alert-circle" class="w-4 h-4"></i>
                    <span id="msg-text">Thông báo lỗi</span>
                </div>
            </div>

        </form>

        <div class="mt-8 text-center border-t border-slate-100 pt-6">
            <p class="text-slate-400 text-xs">
                © 2025 Huy Phong Training System
            </p>
        </div>
    </div>

    <!-- Load Core System -->
    <script src="js/core/config.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/api.js"></script>
    <!-- supabase/api.js will be loaded by API.init() -->
    <script src="js/services/auth.service.js"></script>
    <script src="js/ui/toast.js"></script>

    <script>
        lucide.createIcons();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn');
            const msg = document.getElementById('msg');
            const msgText = document.getElementById('msg-text');
            
            const originalBtnContent = btn.innerHTML;
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Đang xử lý...`; 
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            msg.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // Đợi API init
                await API.init();
                
                const result = await AuthService.login(email, password);

                if (result.success) {
                    Toast.success('Đăng nhập thành công!');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                } else {
                    const errorMsg = result.message || 'Đăng nhập thất bại';
                    if(msgText) msgText.innerText = errorMsg;
                    else msg.innerText = errorMsg;
                    msg.classList.remove('hidden');
                    Toast.error(errorMsg);
                }
            } catch (err) {
                const errorMsg = err.message || "Lỗi kết nối Server! Vui lòng thử lại.";
                if(msgText) msgText.innerText = errorMsg;
                else msg.innerText = errorMsg;
                msg.classList.remove('hidden');
                Toast.error(errorMsg);
                console.error('Login error:', err);
            } finally {
                btn.innerHTML = originalBtnContent;
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
