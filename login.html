<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PT Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 h-screen flex items-center justify-center px-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border border-slate-100">
        <div class="text-center mb-8">
            <div class="bg-blue-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="dumbbell" class="w-8 h-8 text-blue-600"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Chào mừng trở lại</h1>
            <p class="text-slate-500 text-sm">Đăng nhập để bắt đầu tập luyện</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" id="email" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="hocvien@gmail.com" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Mật khẩu</label>
                <input type="password" id="password" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••" required>
            </div>
            
            <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all flex justify-center items-center gap-2">
                <span>Đăng Nhập</span>
            </button>
        </form>
        
        <p id="errorMsg" class="text-red-500 text-sm text-center mt-4 hidden"></p>
    </div>

    <script>
        // Kích hoạt Icon
        lucide.createIcons();

        // ⚠️ THAY URL CỦA BẠN VÀO ĐÂY
        const API_URL = "https://script.google.com/macros/s/AKfycbyDv_79EPDM3BzzbYOXevQrocyh60o-qzU63U3N5p7gIuSD2tWhEVKnO1lR7qAJ6qsS/exec"; 

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const errorMsg = document.getElementById('errorMsg');
            
            // Loading state
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin"></i> Đang xử lý...';
            lucide.createIcons();
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // Gọi API Google Apps Script
                // Lưu ý: mode 'no-cors' không đọc được response, ta dùng POST thường
                // Để đọc được JSON trả về, Web App GAS phải set "Anyone"
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'login',
                        data: { email, password }
                    })
                });

                const result = await response.json();

                if (result.success) {
                    // Lưu user vào bộ nhớ trình duyệt
                    localStorage.setItem('pt_user', JSON.stringify(result.user));
                    // Chuyển trang
                    window.location.href = 'index.html';
                } else {
                    errorMsg.innerText = result.message || "Đăng nhập thất bại!";
                    errorMsg.classList.remove('hidden');
                }

            } catch (err) {
                console.error(err);
                errorMsg.innerText = "Lỗi kết nối server!";
                errorMsg.classList.remove('hidden');
            } finally {
                btn.innerHTML = 'Đăng Nhập';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
