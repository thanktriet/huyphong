<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - PT Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 h-screen flex items-center justify-center px-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
        <div class="text-center mb-6">
            <div class="bg-blue-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
                <i data-lucide="dumbbell" class="w-8 h-8 text-blue-600"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Chào mừng trở lại</h1>
            <p class="text-slate-500 text-sm">Hệ thống quản lý tập luyện</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="text-sm font-bold text-slate-600">Email</label>
                <input type="email" id="email" class="w-full p-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none" placeholder="hocvien@gmail.com" required>
            </div>
            <div>
                <label class="text-sm font-bold text-slate-600">Mật khẩu</label>
                <input type="password" id="password" class="w-full p-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none" placeholder="••••••" required>
            </div>
            <button type="submit" id="btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all">
                Đăng Nhập
            </button>
        </form>
        <p id="msg" class="text-red-500 text-center mt-3 text-sm hidden"></p>
    </div>

    <script>
        lucide.createIcons();

        // ⚠️ THAY LINK CỦA BẠN VÀO ĐÂY
        const API_URL = "https://script.google.com/macros/s/AKfycbyDv_79EPDM3BzzbYOXevQrocyh60o-qzU63U3N5p7gIuSD2tWhEVKnO1lR7qAJ6qsS/exec"; 

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn');
            const msg = document.getElementById('msg');
            
            // Hiệu ứng loading
            btn.innerHTML = 'Đang xử lý...'; 
            btn.disabled = true;
            msg.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', data: { email, password } })
                });
                const result = await res.json();

                if (result.success) {
                    // Lưu thông tin user
                    localStorage.setItem('pt_user', JSON.stringify(result.user));
                    window.location.href = 'index.html';
                } else {
                    msg.innerText = result.message;
                    msg.classList.remove('hidden');
                }
            } catch (err) {
                msg.innerText = "Lỗi kết nối Server!";
                msg.classList.remove('hidden');
            } finally {
                btn.innerHTML = 'Đăng Nhập';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
