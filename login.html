<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/config.js"></script>
</head>
<body class="bg-slate-50 h-screen flex items-center justify-center px-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
        <div class="text-center mb-6">
            <div class="bg-blue-50 w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-3">
                <i data-lucide="dumbbell" class="w-7 h-7 text-blue-600"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">PT Manager</h1>
        </div>
        <form id="loginForm" class="space-y-4">
            <input type="email" id="email" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Email" required>
            <input type="password" id="pass" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Mật khẩu" required>
            <button type="submit" id="btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">Đăng Nhập</button>
        </form>
    </div>
    <script>
        lucide.createIcons();
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn');
            btn.innerText = 'Đang xử lý...'; btn.disabled = true;
            
            const res = await callAPI('login', { 
                email: document.getElementById('email').value, 
                password: document.getElementById('pass').value 
            });

            if (res.success) {
                localStorage.setItem('pt_user', JSON.stringify(res.user));
                window.location.href = 'index.html';
            } else {
                alert(res.message);
                btn.innerText = 'Đăng Nhập'; btn.disabled = false;
            }
        });
    </script>
</body>
</html>
