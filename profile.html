<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ - PT Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Load Core System -->
    <script src="js/core/config.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/services/auth.service.js"></script>
    <script src="js/services/workout.service.js"></script>
    <script src="js/services/nutrition.service.js"></script>
    <script src="js/ui/toast.js"></script>
    <script src="js/ui/loader.js"></script>
    <script src="js/pages/profile.page.js"></script>
    <!-- supabase/api.js will be loaded by API.init() -->

    <link rel="stylesheet" href="css/mobile.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .tab-active { background-color: #2563eb; color: white; border-color: #2563eb; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3); }
        
        /* Progress Bar Animation */
        @keyframes fill { from { width: 0; } }
        .bar-fill { animation: fill 1s ease-out forwards; }
        
        /* Card Styles */
        .history-card { transition: transform 0.2s; }
        .history-card:active { transform: scale(0.98); }
        
        @media (max-width: 640px) {
            body { padding-bottom: 5rem; }
        }
    </style>
</head>
<body class="bg-slate-50 pb-24 font-sans text-slate-800">

    <div class="bg-white p-6 pb-8 rounded-b-[2rem] shadow-sm relative z-10">
        <div class="flex justify-between items-start mb-4">
            <h1 class="text-xl font-bold text-slate-900">Hồ Sơ</h1>
            <button onclick="AuthService.logout()" class="text-red-500 bg-red-50 p-2 rounded-full hover:bg-red-100 transition-colors" title="Đăng xuất">
                <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
        </div>
        
        <div class="flex items-center gap-4">
            <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-indigo-600 text-white rounded-full flex items-center justify-center text-2xl font-bold shadow-lg shadow-blue-200" id="user-avatar">U</div>
            <div>
                <h2 class="text-xl font-bold text-slate-900 leading-tight" id="user-name">...</h2>
                <p class="text-sm text-slate-500" id="user-email">...</p>
                <p class="text-xs text-slate-400 mt-1" id="user-role">...</p>
                <div class="mt-2 flex gap-2">
                    <span class="text-[10px] font-bold bg-blue-50 text-blue-600 px-2 py-1 rounded-lg border border-blue-100" id="pSession">0 Buổi</span>
                    <span class="text-[10px] font-bold bg-green-50 text-green-600 px-2 py-1 rounded-lg border border-green-100" id="pExpiry">...</span>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 -mt-6 relative z-20 space-y-6">

        <div class="flex bg-white p-1.5 rounded-xl shadow-sm border border-slate-100">
            <button onclick="ProfilePage.switchTab('workout')" class="tab-btn flex-1 py-2.5 text-xs font-bold rounded-lg transition-all bg-blue-600 text-white">Lịch Sử Tập</button>
            <button onclick="ProfilePage.switchTab('nutrition')" class="tab-btn flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-500 hover:bg-slate-50 transition-all bg-slate-100">Lịch Sử Ăn</button>
            <button onclick="ProfilePage.switchTab('body')" class="tab-btn flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-500 hover:bg-slate-50 transition-all bg-slate-100">Cơ Thể</button>
        </div>

        <div id="tab-workout" class="tab-content space-y-4">
            <div id="workout-history" class="space-y-3 pb-10">
                <div class="text-center py-10 text-slate-400"><i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2"></i>Đang tải...</div>
            </div>
        </div>

        <div id="tab-nutrition" class="tab-content hidden space-y-4">
            <div id="nutrition-history" class="space-y-3 pb-10"></div>
        </div>

        <div id="tab-body" class="tab-content hidden space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-slate-800 text-base">Lịch Sử Thể Trạng</h2>
                <button onclick="ProfilePage.openAddBodyStats()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 shadow hover:bg-blue-700 transition-colors active:scale-95">
                    <i data-lucide="plus" class="w-4 h-4"></i> Thêm Mới
                </button>
            </div>
            <div id="body-history" class="space-y-3 pb-10"></div>
        </div>

        <button onclick="document.getElementById('modal-pass').classList.remove('hidden')" class="w-full py-3 text-xs font-bold text-slate-400 hover:text-slate-600 border-t border-slate-200">
            <i data-lucide="lock" class="w-3 h-3 inline mr-1"></i> Đổi mật khẩu
        </button>

    </div>

    <div id="modal-pass" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-50 px-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Đổi Mật Khẩu</h3>
            <form id="form-pass" class="space-y-3">
                <input type="password" id="oldPass" class="w-full border p-3 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 ring-blue-500 outline-none" placeholder="Mật khẩu cũ" required>
                <input type="password" id="newPass" class="w-full border p-3 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 ring-blue-500 outline-none" placeholder="Mật khẩu mới" required>
                <div class="flex gap-3 mt-4">
                    <button type="button" onclick="document.getElementById('modal-pass').classList.add('hidden')" class="flex-1 py-3 rounded-xl bg-slate-100 text-slate-500 font-bold text-sm">Hủy</button>
                    <button type="submit" id="btnChange" class="flex-1 py-3 rounded-xl bg-blue-600 text-white font-bold text-sm shadow-lg">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-body-stats" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-50 px-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-800">Thêm Thể Trạng</h3>
                <button onclick="ProfilePage.closeAddBodyStats()" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="form-body-stats" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Cân nặng (kg)</label>
                    <div class="relative">
                        <input type="number" id="body-weight" step="0.1" min="0" class="w-full border-2 border-slate-200 p-3.5 rounded-xl text-lg font-bold text-slate-800 bg-slate-50 focus:bg-white focus:border-blue-500 focus:ring-2 ring-blue-500 outline-none" placeholder="0.0" required>
                        <span class="absolute right-4 top-4 text-sm text-slate-400 font-bold">kg</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Vòng eo (cm)</label>
                    <div class="relative">
                        <input type="number" id="body-waist" step="0.1" min="0" class="w-full border-2 border-slate-200 p-3.5 rounded-xl text-lg font-bold text-slate-800 bg-slate-50 focus:bg-white focus:border-blue-500 focus:ring-2 ring-blue-500 outline-none" placeholder="0.0" required>
                        <span class="absolute right-4 top-4 text-sm text-slate-400 font-bold">cm</span>
                    </div>
                </div>
                <div class="flex gap-3 mt-6">
                    <button type="button" onclick="ProfilePage.closeAddBodyStats()" class="flex-1 py-3 rounded-xl bg-slate-100 text-slate-500 font-bold text-sm active:scale-95 transition-all">Hủy</button>
                    <button type="submit" id="btnSaveBodyStats" class="flex-1 py-3 rounded-xl bg-blue-600 text-white font-bold text-sm shadow-lg active:scale-95 transition-all">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 safe-area-pb">
        <div class="max-w-md mx-auto flex justify-around items-center h-16">
            <a href="index.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600"><i data-lucide="home" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Home</span></a>
            <a href="workout.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600"><i data-lucide="dumbbell" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Tập</span></a>
            <a href="nutrition.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600"><i data-lucide="utensils" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Ăn</span></a>
            <a href="schedule.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600"><i data-lucide="calendar" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Lịch</span></a>
            <a href="profile.html" class="flex flex-col items-center justify-center w-full h-full text-blue-600"><i data-lucide="user" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">Tôi</span></a>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        // Initialize page
        (async function() {
            await API.init();
            
            const user = AuthService.getCurrentUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            // User info will be filled by ProfilePage.init()
            
            await ProfilePage.init();
        })();

        // Password Change
        document.getElementById('form-pass').addEventListener('submit', async (e) => {
            e.preventDefault();
            const oldPass = document.getElementById('oldPass').value;
            const newPass = document.getElementById('newPass').value;
            const btn = document.getElementById('btnChange');
            
            if(oldPass === newPass) {
                Toast.error("Mật khẩu mới phải khác!");
                return;
            }
            
            btn.innerText = "Đang xử lý...";
            btn.disabled = true;
            
            try {
                const result = await API.call('changePassword', { 
                    userId: AuthService.getCurrentUser().id, 
                    oldPass, 
                    newPass 
                });
                
                if(result.success) {
                    Toast.success("Đổi mật khẩu thành công!");
                    document.getElementById('modal-pass').classList.add('hidden');
                    document.getElementById('form-pass').reset();
                } else {
                    Toast.error(result.message || 'Lỗi đổi mật khẩu');
                }
            } catch (error) {
                Toast.error('Lỗi: ' + error.message);
            } finally {
                btn.innerText = "Lưu";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
