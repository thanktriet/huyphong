<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ - PT Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="layout.js"></script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .tab-active { background-color: #2563eb; color: white; border-color: #2563eb; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3); }
        
        /* Progress Bar Animation */
        @keyframes fill { from { width: 0; } }
        .bar-fill { animation: fill 1s ease-out forwards; }
        
        /* Card Styles */
        .history-card { transition: transform 0.2s; }
        .history-card:active { transform: scale(0.98); }
    </style>
</head>
<body class="bg-slate-50 pb-24 font-sans text-slate-800">

    <div class="bg-white p-6 pb-8 rounded-b-[2rem] shadow-sm relative z-10">
        <div class="flex justify-between items-start mb-4">
            <h1 class="text-xl font-bold text-slate-900">Hồ Sơ</h1>
            <button onclick="logout()" class="text-red-500 bg-red-50 p-2 rounded-full hover:bg-red-100 transition-colors" title="Đăng xuất">
                <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
        </div>
        
        <div class="flex items-center gap-4">
            <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-indigo-600 text-white rounded-full flex items-center justify-center text-2xl font-bold shadow-lg shadow-blue-200" id="avt">U</div>
            <div>
                <h2 class="text-xl font-bold text-slate-900 leading-tight" id="pName">...</h2>
                <p class="text-sm text-slate-500" id="pEmail">...</p>
                <div class="mt-2 flex gap-2">
                    <span class="text-[10px] font-bold bg-blue-50 text-blue-600 px-2 py-1 rounded-lg border border-blue-100" id="pSession">0 Buổi</span>
                    <span class="text-[10px] font-bold bg-green-50 text-green-600 px-2 py-1 rounded-lg border border-green-100" id="pExpiry">...</span>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 -mt-6 relative z-20 space-y-6">

        <div class="flex bg-white p-1.5 rounded-xl shadow-sm border border-slate-100">
            <button onclick="switchTab('workout', this)" class="flex-1 py-2.5 text-xs font-bold rounded-lg transition-all tab-active">Lịch Sử Tập</button>
            <button onclick="switchTab('nutrition', this)" class="flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-500 hover:bg-slate-50 transition-all">Lịch Sử Ăn</button>
            <button onclick="switchTab('body', this)" class="flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-500 hover:bg-slate-50 transition-all">Cơ Thể</button>
        </div>

        <div id="view-workout" class="view-section space-y-4">
            <div id="workout-list" class="space-y-3 pb-10">
                <div class="text-center py-10 text-slate-400"><i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2"></i>Đang tải...</div>
            </div>
        </div>

        <div id="view-nutrition" class="view-section hidden space-y-4">
            <div id="nutrition-list" class="space-y-3 pb-10"></div>
        </div>

        <div id="view-body" class="view-section hidden space-y-4">
            <div id="body-list" class="space-y-3 pb-10"></div>
        </div>

        <button onclick="document.getElementById('modal-pass').classList.remove('hidden')" class="w-full py-3 text-xs font-bold text-slate-400 hover:text-slate-600 border-t border-slate-200">
            <i data-lucide="lock" class="w-3 h-3 inline mr-1"></i> Đổi mật khẩu
        </button>

    </div>

    <div id="modal-pass" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-50 px-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Đổi Mật Khẩu</h3>
            <form id="form-pass" class="space-y-3">
                <input type="password" id="oldPass" class="w-full border p-3 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 ring-blue-500 outline-none" placeholder="Mật khẩu cũ" required>
                <input type="password" id="newPass" class="w-full border p-3 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 ring-blue-500 outline-none" placeholder="Mật khẩu mới" required>
                <div class="flex gap-3 mt-4">
                    <button type="button" onclick="document.getElementById('modal-pass').classList.add('hidden')" class="flex-1 py-3 rounded-xl bg-slate-100 text-slate-500 font-bold text-sm">Hủy</button>
                    <button type="submit" id="btnChange" class="flex-1 py-3 rounded-xl bg-blue-600 text-white font-bold text-sm shadow-lg">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 safe-area-pb">
        <div class="max-w-md mx-auto flex justify-around items-center h-16">
            <a href="index.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600"><i data-lucide="home" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Home</span></a>
            <a href="workout.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600"><i data-lucide="dumbbell" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Tập</span></a>
            <a href="nutrition.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600"><i data-lucide="utensils" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Ăn</span></a>
            <a href="schedule.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600"><i data-lucide="calendar" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Lịch</span></a>
            <a href="profile.html" class="flex flex-col items-center justify-center w-full h-full text-blue-600"><i data-lucide="user" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">Tôi</span></a>
        </div>
    </div>

    <script>
        // INIT
        lucide.createIcons();
        const user = JSON.parse(localStorage.getItem('pt_user'));
        if (!user) window.location.href = 'login.html';

        // Fill Info
        document.getElementById('pName').innerText = user.name;
        document.getElementById('pEmail').innerText = user.email;
        document.getElementById('avt').innerText = user.name.charAt(0);
        document.getElementById('pSession').innerText = `${user.sessionLeft || 0} Buổi`;
        document.getElementById('pExpiry').innerText = `Hạn: ${user.expiryDate || '--'}`;

        // STARTUP
        initHistory();

        async function initHistory() {
            await Promise.all([loadWorkoutHistory(), loadNutritionHistory(), loadBodyHistory()]);
        }

        // --- 1. WORKOUT HISTORY ---
        async function loadWorkoutHistory() {
            try {
                const res = await callAPI('get_workout_history', { userId: user.id });
                const list = document.getElementById('workout-list');
                
                if(res.success && Object.keys(res.data).length > 0) {
                    // Sort date descending
                    const dates = Object.keys(res.data).sort((a,b) => new Date(b).getTime() - new Date(a).getTime());
                    
                    list.innerHTML = dates.map(date => {
                        const logs = res.data[date];
                        // Format Date nicely: "2025-11-25" -> "25/11/2025"
                        const displayDate = date.split('-').reverse().join('/');
                        
                        return `
                        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden history-card">
                            <div class="bg-slate-50 px-4 py-2.5 border-b border-slate-100 flex justify-between items-center">
                                <div class="flex items-center gap-2">
                                    <div class="bg-white p-1.5 rounded-lg border border-slate-200 shadow-sm">
                                        <i data-lucide="calendar-check" class="w-4 h-4 text-blue-600"></i>
                                    </div>
                                    <span class="font-bold text-sm text-slate-700">${displayDate}</span>
                                </div>
                                <span class="text-[10px] font-bold bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full">${logs.length} sets</span>
                            </div>
                            <div class="divide-y divide-slate-50">
                                ${logs.map(l => `
                                    <div class="p-3 flex justify-between items-center text-sm hover:bg-slate-50 transition-colors">
                                        <span class="font-medium text-slate-700 line-clamp-1 text-xs">${l.exercise}</span>
                                        <div class="flex items-center gap-1 bg-slate-50 px-2 py-1 rounded border border-slate-100">
                                            <span class="font-bold text-slate-800">${l.weight}kg</span>
                                            <span class="text-slate-300">x</span>
                                            <span class="font-bold text-slate-600">${l.reps}</span>
                                        </div>
                                    </div>`).join('')}
                            </div>
                        </div>`;
                    }).join('');
                } else {
                    list.innerHTML = '<div class="text-center py-10 text-slate-400"><i data-lucide="dumbbell" class="w-8 h-8 mx-auto mb-2 opacity-20"></i><p>Chưa có lịch sử tập.</p></div>';
                }
                lucide.createIcons();
            } catch(e) { console.log(e); }
        }

        // --- 2. NUTRITION HISTORY ---
        async function loadNutritionHistory() {
            try {
                const res = await callAPI('get_nutrition_history', { userId: user.id });
                const list = document.getElementById('nutrition-list');
                
                if(res.success && Object.keys(res.data).length > 0) {
                    const dates = Object.keys(res.data).sort((a,b) => new Date(b).getTime() - new Date(a).getTime());
                    
                    list.innerHTML = dates.map(date => {
                        const d = res.data[date];
                        const displayDate = date.split('-').reverse().join('/');
                        const percent = Math.min((d.cal / 2000) * 100, 100); // Giả sử Goal là 2000
                        const color = percent > 100 ? 'bg-red-500' : 'bg-green-500';

                        return `
                        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 history-card">
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-bold text-sm text-slate-700">${displayDate}</span>
                                <span class="text-xs font-bold text-slate-500">${Math.round(d.cal)} kcal</span>
                            </div>
                            
                            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden mb-3">
                                <div class="h-full ${color} bar-fill" style="width: ${percent}%"></div>
                            </div>
                            
                            <div class="grid grid-cols-3 gap-2 text-center">
                                <div class="bg-red-50 rounded-lg p-1 border border-red-100">
                                    <div class="text-[9px] text-red-400 font-bold uppercase">Pro</div>
                                    <div class="text-xs font-bold text-red-600">${Math.round(d.pro)}g</div>
                                </div>
                                <div class="bg-orange-50 rounded-lg p-1 border border-orange-100">
                                    <div class="text-[9px] text-orange-400 font-bold uppercase">Carb</div>
                                    <div class="text-xs font-bold text-orange-600">${Math.round(d.carb)}g</div>
                                </div>
                                <div class="bg-yellow-50 rounded-lg p-1 border border-yellow-100">
                                    <div class="text-[9px] text-yellow-500 font-bold uppercase">Fat</div>
                                    <div class="text-xs font-bold text-yellow-600">${Math.round(d.fat)}g</div>
                                </div>
                            </div>
                        </div>`;
                    }).join('');
                } else {
                    list.innerHTML = '<div class="text-center py-10 text-slate-400"><i data-lucide="utensils" class="w-8 h-8 mx-auto mb-2 opacity-20"></i><p>Chưa có nhật ký ăn uống.</p></div>';
                }
            } catch(e) {}
        }

        // --- 3. BODY HISTORY ---
        async function loadBodyHistory() {
            try {
                const res = await callAPI('get_body_history', { userId: user.id });
                const list = document.getElementById('body-list');
                
                if(res.success && res.data.length > 0) {
                    // Mới nhất lên đầu
                    const sorted = res.data.reverse();
                    
                    list.innerHTML = sorted.map((b, i) => {
                        const change = i < sorted.length - 1 ? (b.weight - sorted[i+1].weight).toFixed(1) : 0;
                        const changeColor = change < 0 ? 'text-green-600' : (change > 0 ? 'text-red-500' : 'text-slate-400');
                        const changeIcon = change < 0 ? 'fa-arrow-down' : 'fa-arrow-up';
                        const dateParts = b.date.split('-'); // Giả sử server trả YYYY-MM-DD

                        return `
                        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 flex justify-between items-center history-card">
                            <div class="flex items-center gap-3">
                                <div class="bg-slate-50 p-2 rounded-xl text-slate-400 border border-slate-100">
                                    <i data-lucide="scale" class="w-5 h-5"></i>
                                </div>
                                <div>
                                    <div class="font-bold text-slate-800">${b.weight} kg</div>
                                    <div class="text-xs text-slate-400">${dateParts[2]}/${dateParts[1]}/${dateParts[0]}</div>
                                </div>
                            </div>
                            
                            <div class="text-right">
                                <div class="text-xs font-bold ${changeColor}">${change > 0 ? '+' : ''}${change} kg</div>
                                <div class="text-[10px] text-slate-400 uppercase font-bold">Thay đổi</div>
                            </div>
                        </div>`;
                    }).join('');
                    lucide.createIcons();
                } else {
                    list.innerHTML = '<div class="text-center py-10 text-slate-400"><i data-lucide="scale" class="w-8 h-8 mx-auto mb-2 opacity-20"></i><p>Chưa có dữ liệu cân nặng.</p></div>';
                }
            } catch(e) {}
        }

        // UI Functions
        function switchTab(name, btn) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${name}`).classList.remove('hidden');
            
            document.querySelectorAll('div.flex.bg-white button').forEach(b => {
                b.className = 'flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-500 hover:bg-slate-50 transition-all';
            });
            btn.className = 'flex-1 py-2.5 text-xs font-bold rounded-lg transition-all tab-active';
        }

        // Password Change
        document.getElementById('form-pass').addEventListener('submit', async (e) => {
            e.preventDefault();
            const oldPass = document.getElementById('oldPass').value;
            const newPass = document.getElementById('newPass').value;
            const btn = document.getElementById('btnChange');
            
            if(oldPass===newPass) return showToast("Mật khẩu mới phải khác!", "error");
            
            btn.innerText = "Đang xử lý..."; btn.disabled = true;
            const res = await callAPI('change_password', { userId: user.id, oldPass, newPass });
            
            if(res.success) {
                showToast("Đổi mật khẩu thành công!");
                document.getElementById('modal-pass').classList.add('hidden');
                document.getElementById('form-pass').reset();
            } else {
                showToast(res.message, "error");
            }
            btn.innerText = "Lưu"; btn.disabled = false;
        });

    </script>
</body>
</html>
