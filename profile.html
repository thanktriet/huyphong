<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ - PT Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: white; padding: 12px 20px; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s ease-out; border-left: 4px solid; }
        .toast.success { border-color: #22c55e; } .toast.error { border-color: #ef4444; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50 pb-24 font-sans text-slate-800">
    <div id="toast-container"></div>

    <div class="bg-white p-4 sticky top-0 z-20 shadow-sm flex justify-between items-center">
        <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
            <i data-lucide="user-circle" class="text-blue-600 w-6 h-6"></i> Hồ Sơ
        </h1>
    </div>

    <div class="max-w-md mx-auto px-4 mt-6 space-y-6">

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center">
            <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-3xl font-bold mx-auto mb-3" id="avt">U</div>
            <h2 class="text-xl font-bold text-slate-900" id="pName">...</h2>
            <p class="text-sm text-slate-500" id="pEmail">...</p>
            
            <div class="mt-6 grid grid-cols-2 gap-4 border-t pt-4">
                <div>
                    <p class="text-xs text-slate-400 uppercase font-bold">Gói tập còn</p>
                    <p class="text-xl font-bold text-blue-600"><span id="pSession">0</span> buổi</p>
                </div>
                <div>
                    <p class="text-xs text-slate-400 uppercase font-bold">Hết hạn</p>
                    <p class="text-xl font-bold text-green-600" id="pExpiry">---</p>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i data-lucide="lock" class="w-4 h-4 text-slate-400"></i> Đổi Mật Khẩu
            </h3>
            <form id="form-pass" class="space-y-3">
                <div>
                    <input type="password" id="oldPass" class="w-full border p-3 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 ring-blue-500 outline-none transition-all" placeholder="Mật khẩu cũ" required>
                </div>
                <div>
                    <input type="password" id="newPass" class="w-full border p-3 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 ring-blue-500 outline-none transition-all" placeholder="Mật khẩu mới" required>
                </div>
                <button type="submit" id="btnChange" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-slate-800 transition-all active:scale-95">
                    Cập Nhật Mật Khẩu
                </button>
            </form>
        </div>

        <button onclick="logout()" class="w-full bg-red-50 text-red-500 font-bold py-3 rounded-xl border border-red-100 hover:bg-red-100 transition-all flex items-center justify-center gap-2">
            <i data-lucide="log-out" class="w-4 h-4"></i> Đăng Xuất
        </button>

    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 safe-area-pb">
        <div class="max-w-md mx-auto flex justify-around items-center h-16">
            <a href="index.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600"><i data-lucide="home" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Home</span></a>
            <a href="workout.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600"><i data-lucide="dumbbell" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Tập</span></a>
            <a href="nutrition.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600"><i data-lucide="utensils" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Ăn</span></a>
            <a href="schedule.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600"><i data-lucide="calendar" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Lịch</span></a>
            <a href="profile.html" class="flex flex-col items-center justify-center w-full h-full text-blue-600"><i data-lucide="user" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">Tôi</span></a>
        </div>
    </div>

    <script>
        // CONFIG
        const API_URL = "https://script.google.com/macros/s/AKfycbyDv_79EPDM3BzzbYOXevQrocyh60o-qzU63U3N5p7gIuSD2tWhEVKnO1lR7qAJ6qsS/exec"; 
        lucide.createIcons();
        
        const userJson = localStorage.getItem('pt_user');
        if (!userJson) window.location.href = 'login.html';
        const user = JSON.parse(userJson);

        // Init Info
        document.getElementById('pName').innerText = user.name;
        document.getElementById('pEmail').innerText = user.email;
        document.getElementById('avt').innerText = user.name.charAt(0);
        document.getElementById('pSession').innerText = user.sessionLeft || 0;
        document.getElementById('pExpiry').innerText = user.expiryDate || "---";

        // Toast Func
        function showToast(msg, type='success') {
            const t = document.createElement('div'); t.className = `toast ${type}`;
            t.innerHTML = `<i data-lucide="${type==='success'?'check-circle':'alert-circle'}" class="w-5 ${type==='success'?'text-green-600':'text-red-600'}"></i><span>${msg}</span>`;
            document.getElementById('toast-container').appendChild(t); lucide.createIcons(); setTimeout(() => t.remove(), 3000);
        }

        // Change Password Logic
        document.getElementById('form-pass').addEventListener('submit', async (e) => {
            e.preventDefault();
            const oldPass = document.getElementById('oldPass').value;
            const newPass = document.getElementById('newPass').value;
            const btn = document.getElementById('btnChange');

            if(oldPass === newPass) return showToast("Mật khẩu mới phải khác cũ!", "error");

            btn.innerText = "Đang xử lý..."; btn.disabled = true;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'change_password',
                        data: { userId: user.id, oldPass: oldPass, newPass: newPass }
                    })
                });
                const result = await res.json();

                if (result.success) {
                    showToast("Đổi mật khẩu thành công!");
                    document.getElementById('form-pass').reset();
                } else {
                    showToast(result.message, "error");
                }
            } catch (err) {
                showToast("Lỗi kết nối server", "error");
            } finally {
                btn.innerText = "Cập Nhật Mật Khẩu"; btn.disabled = false;
            }
        });

        function logout() {
            if(confirm('Bạn có chắc chắn muốn đăng xuất?')) {
                localStorage.removeItem('pt_user');
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
