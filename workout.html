<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tập Luyện</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="layout.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .tab-active { background-color: #2563eb; color: white; border-color: #2563eb; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3); }
        .set-row { transition: all 0.2s ease; }
        .set-done { background-color: #eff6ff; border-color: #bfdbfe; }
        .set-done input { color: #2563eb; font-weight: bold; background-color: transparent; }
        /* Modal Image */
        #modal-image { backdrop-filter: blur(5px); transition: opacity 0.3s; }
    </style>
</head>
<body class="bg-slate-50 pb-32 font-sans text-slate-800">

    <div class="bg-white p-4 sticky top-0 z-20 shadow-sm border-b border-slate-100 flex justify-between items-center">
        <div><h1 class="text-xl font-bold flex items-center gap-2"><i data-lucide="dumbbell" class="text-blue-600 w-6"></i> Lịch Tập</h1><p class="text-xs text-slate-500" id="currentDate">...</p></div>
        <button onclick="resetProgress()" class="text-xs text-red-500 bg-red-50 px-3 py-1.5 rounded font-medium">Reset</button>
    </div>

    <div class="max-w-md mx-auto px-4 mt-4">
        <div class="sticky top-[73px] z-10 bg-slate-50/95 backdrop-blur pt-2 pb-2"><div id="tabs" class="flex gap-2 overflow-x-auto no-scrollbar"><div class="w-full h-10 bg-slate-200 animate-pulse rounded-lg"></div></div></div>
        
        <div id="workout-view"><div id="todo-list" class="space-y-5 pb-20"><p class="text-center text-slate-400 py-10">Đang tải...</p></div></div>
        <div id="history-view" class="hidden space-y-4 animate-in fade-in pb-20"></div>
    </div>

    <div id="floating-action" class="fixed bottom-20 left-0 right-0 px-4 max-w-md mx-auto z-30">
        <div class="bg-white/90 backdrop-blur-sm p-2 rounded-2xl border border-slate-200 shadow-2xl">
            <div class="flex justify-between items-center mb-2 px-2"><span class="text-xs font-bold text-slate-500">Đã xong: <span id="selectedCount" class="text-blue-600 text-lg font-black">0</span> sets</span></div>
            <button onclick="finishWorkout()" id="btnFinish" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg flex justify-center items-center gap-2"><span>Lưu & Hoàn Thành</span> <i data-lucide="check-circle-2" class="w-5"></i></button>
        </div>
    </div>

    <div id="modal-image" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 p-4" onclick="closeImageModal()">
        <div class="relative max-w-full max-h-full">
            <img id="img-preview" src="" class="max-h-[80vh] max-w-full rounded-lg shadow-2xl" onclick="event.stopPropagation()">
            <button onclick="closeImageModal()" class="absolute -top-10 right-0 text-white p-2"><i data-lucide="x" class="w-8 h-8"></i></button>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 safe-area-pb"><div class="max-w-md mx-auto flex justify-around items-center h-16"><a href="index.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600"><i data-lucide="home" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Home</span></a><a href="workout.html" class="flex flex-col items-center justify-center w-full h-full text-blue-600"><i data-lucide="dumbbell" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">Tập</span></a><a href="nutrition.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600"><i data-lucide="utensils" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Ăn</span></a><a href="schedule.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600"><i data-lucide="calendar" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Lịch</span></a><button onclick="logout()" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-red-500"><i data-lucide="log-out" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Thoát</span></button></div></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyDv_79EPDM3BzzbYOXevQrocyh60o-qzU63U3N5p7gIuSD2tWhEVKnO1lR7qAJ6qsS/exec"; 
        lucide.createIcons();
        document.getElementById('currentDate').innerText = `Hôm nay: ${new Date().toLocaleDateString('vi-VN')}`;
        const user = JSON.parse(localStorage.getItem('pt_user'));
        if (!user) window.location.href = 'login.html';

        const KEY_PLAN = `pt_cache_plan_${user.id}`;
        const KEY_PROG = `pt_progress_v21_${user.id}`; // Key mới
        let PLANS = JSON.parse(localStorage.getItem(KEY_PLAN)) || {};
        let PROGRESS = JSON.parse(localStorage.getItem(KEY_PROG)) || {};
        let SET_COUNTS = {}; let CURRENT_TAB = "";

        async function init() {
            if (Object.keys(PLANS).length > 0) renderTabs();
            else document.getElementById('todo-list').innerHTML = '<p class="text-center text-slate-400 py-10">Đang tải...</p>';
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'get_student_plan', data: { userId: user.id } }) });
                const data = await res.json();
                if(data.success && data.data) {
                    PLANS = data.data;
                    localStorage.setItem(KEY_PLAN, JSON.stringify(PLANS));
                    renderTabs();
                }
                updateCounter();
            } catch(e) { console.log("Offline mode"); }
        }

        function renderTabs() {
            const days = Object.keys(PLANS);
            const container = document.getElementById('tabs');
            let html = days.map((day, i) => `<button onclick="switchTab('${day}', this)" class="px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap border transition-all ${i===0 ? 'tab-active' : 'bg-white text-slate-600 border-slate-200'}">${day}</button>`).join('');
            html += `<button onclick="showHistory(this)" class="px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap border bg-orange-50 text-orange-600 border-orange-200 flex items-center gap-1"><i data-lucide="history" class="w-3 h-3"></i> Lịch sử</button>`;
            container.innerHTML = html;
            lucide.createIcons();
            if(!CURRENT_TAB && days.length > 0) switchTab(days[0], container.children[0]);
            else if(CURRENT_TAB && CURRENT_TAB !== 'HISTORY') renderExercises(CURRENT_TAB);
        }

        function switchTab(day, btn) {
            CURRENT_TAB = day;
            document.getElementById('history-view').classList.add('hidden');
            document.getElementById('workout-view').classList.remove('hidden');
            document.getElementById('floating-action').classList.remove('hidden');
            updateTabStyles(btn);
            renderExercises(day);
        }

        function renderExercises(day) {
            const list = document.getElementById('todo-list');
            const exercises = PLANS[day] || [];
            list.innerHTML = exercises.map((ex, i) => {
                const exKey = `${day}_${ex.exercise}`;
                let maxSavedSet = 0;
                Object.keys(PROGRESS).forEach(k => { if(k.startsWith(exKey+'_set')) { const num = parseInt(k.split('_set')[1]); if(num > maxSavedSet) maxSavedSet = num; } });
                if (!SET_COUNTS[exKey]) SET_COUNTS[exKey] = Math.max(ex.sets, maxSavedSet);
                
                let setsHtml = '';
                for(let s=1; s <= SET_COUNTS[exKey]; s++) {
                    const key = `${exKey}_set${s}`, saved = PROGRESS[key] || {}, isChecked = saved.checked ? 'checked' : '', rowClass = saved.checked ? 'set-done' : '', wVal = saved.weight || '', rVal = saved.reps || ex.reps;
                    setsHtml += `<div class="flex items-center gap-2 p-2 rounded-lg border border-slate-100 ${rowClass} mb-2" id="row-${key}">
                        <div class="w-6 h-6 bg-slate-100 rounded-full flex items-center justify-center text-[10px] font-bold text-slate-500 shadow-sm">${s}</div>
                        <div class="flex-1 grid grid-cols-2 gap-2"><input type="number" id="w-${key}" value="${wVal}" oninput="saveTemp('${key}')" class="w-full bg-slate-50 border rounded p-1.5 text-center font-bold text-sm outline-none" placeholder="Kg"><input type="number" id="r-${key}" value="${rVal}" oninput="saveTemp('${key}')" class="w-full bg-slate-50 border rounded p-1.5 text-center font-bold text-sm outline-none" placeholder="Reps"></div>
                        <input type="checkbox" ${isChecked} onchange="toggleSet('${key}', '${ex.exercise}', ${s})" class="w-6 h-6 rounded accent-blue-600 block">
                        <button onclick="removeSet('${day}', '${ex.exercise}', ${s})" class="text-slate-300 hover:text-red-500 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>`;
                }

                // XỬ LÝ ẢNH (Thay video)
                const imageBtn = ex.image ? 
                    `<button onclick="viewImage('${ex.image}')" class="w-9 h-9 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center hover:bg-purple-100 transition-colors"><i data-lucide="image" class="w-5 h-5"></i></button>` : '';

                return `<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden"><div class="p-3 bg-slate-50 border-b border-slate-100 flex justify-between items-center"><div><h3 class="font-bold text-slate-800">${ex.exercise}</h3>${ex.note ? `<p class="text-xs text-slate-500 mt-0.5 bg-white px-2 py-0.5 rounded border inline-block">💡 ${ex.note}</p>` : ''}</div><div class="flex gap-2">${imageBtn}</div></div><div class="p-3">${setsHtml}<button onclick="addSet('${day}', '${ex.exercise}')" class="w-full py-2 text-xs font-bold text-blue-600 bg-blue-50 rounded border border-dashed border-blue-200 flex items-center justify-center gap-1"><i data-lucide="plus" class="w-3 h-3"></i> Thêm Set</button></div></div>`;
            }).join('');
            lucide.createIcons();
            updateCounter();
        }

        // IMAGE MODAL
        function viewImage(url) {
            const modal = document.getElementById('modal-image');
            const img = document.getElementById('img-preview');
            img.src = url;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }
        function closeImageModal() {
            document.getElementById('modal-image').classList.add('hidden');
            document.getElementById('modal-image').classList.remove('flex');
        }

        // LOGIC CŨ (GIỮ NGUYÊN)
        function saveTemp(k) { const w=document.getElementById(`w-${k}`).value, r=document.getElementById(`r-${k}`).value; if(!PROGRESS[k]) PROGRESS[k]={}; PROGRESS[k].weight=w; PROGRESS[k].reps=r; localStorage.setItem(KEY_PROG, JSON.stringify(PROGRESS)); }
        function toggleSet(k,n,s) { const w=document.getElementById(`w-${k}`).value, r=document.getElementById(`r-${k}`).value, row=document.getElementById(`row-${k}`); if(!w||!r){alert("Nhập số liệu!"); event.target.checked=false; return;} if(event.target.checked){row.classList.add('set-done'); PROGRESS[k]={weight:w,reps:r,checked:true,exercise:n,setNum:s};} else {row.classList.remove('set-done'); if(PROGRESS[k]) PROGRESS[k].checked=false;} localStorage.setItem(KEY_PROG, JSON.stringify(PROGRESS)); updateCounter(); }
        function addSet(d,n) { SET_COUNTS[`${d}_${n}`]++; renderExercises(d); }
        function removeSet(d,n,s) { const k=`${d}_${n}`; if(SET_COUNTS[k]<=1)return alert("Giữ 1 set!"); if(confirm("Xóa?")){ delete PROGRESS[`${k}_set${s}`]; SET_COUNTS[k]--; localStorage.setItem(KEY_PROG, JSON.stringify(PROGRESS)); renderExercises(d); } }
        function updateCounter() { const c=Object.values(PROGRESS).filter(i=>i.checked).length; document.getElementById('selectedCount').innerText=c; document.getElementById('btnFinish').disabled=c===0; }
        function resetProgress() { if(confirm("Xóa nhập liệu?")) { localStorage.removeItem(KEY_PROG); PROGRESS={}; SET_COUNTS={}; renderExercises(CURRENT_TAB); } }

        async function finishWorkout() {
            const logs=Object.values(PROGRESS).filter(i=>i.checked).map(i=>({exercise:i.exercise, weight:i.weight, reps:i.reps}));
            if(logs.length==0) return alert("Chưa tick!");
            if(!confirm("Lưu kết quả?")) return;
            document.getElementById('btnFinish').innerText="Đang gửi...";
            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'log_workout', data: { userId: user.id, logs } }) });
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'deduct_session', data: { userId: user.id } }) });
                alert("✅ Thành công!");
                localStorage.removeItem(KEY_PROG); PROGRESS={}; SET_COUNTS={};
                document.querySelector("button[onclick='showHistory(this)']").click();
            } catch(e){ alert("Lỗi: "+e); }
            document.getElementById('btnFinish').innerHTML=`<span>Lưu & Hoàn Thành</span> <i data-lucide="check-circle-2" class="w-5"></i>`;
            document.getElementById('btnFinish').disabled=false;
            updateCounter();
        }

        async function showHistory(btn) {
            CURRENT_TAB="HISTORY"; updateTabStyles(btn);
            document.getElementById('workout-view').classList.add('hidden');
            document.getElementById('floating-action').classList.add('hidden');
            const hv=document.getElementById('history-view'); hv.classList.remove('hidden');
            hv.innerHTML='<p class="text-center text-slate-400 pt-10">Đang tải...</p>';
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'get_workout_history', data: { userId: user.id } }) });
            const r = await res.json();
            if(r.success && Object.keys(r.data).length>0) {
                const d=Object.keys(r.data).sort((a,b)=>new Date(b.split('/').reverse().join('-'))-new Date(a.split('/').reverse().join('-')));
                hv.innerHTML=d.map(dt=>`<div class="bg-white rounded-xl shadow-sm border overflow-hidden"><div class="bg-slate-50 px-4 py-2 border-b font-bold text-sm flex justify-between"><span>${dt}</span><span>${r.data[dt].length} sets</span></div><div class="divide-y">${r.data[dt].map(l=>`<div class="p-3 flex justify-between text-sm"><span class="font-medium">${l.exercise}</span><span class="font-bold text-blue-600">${l.weight}kg x ${l.reps}</span></div>`).join('')}</div></div>`).join('');
            } else hv.innerHTML='<p class="text-center text-slate-400 pt-10">Chưa có lịch sử.</p>';
        }

        function updateTabStyles(btn) { document.querySelectorAll('#tabs button').forEach(b=>b.className=b.innerText.includes('Lịch sử')?'px-4 py-2 rounded-lg text-sm font-bold border bg-orange-50 text-orange-600 border-orange-200':'px-4 py-2 rounded-lg text-sm font-bold border bg-white text-slate-600 border-slate-200'); btn.className+=' tab-active'; }
        function logout() { if(confirm('Đăng xuất?')) { localStorage.removeItem('pt_user'); window.location.href='login.html'; } }
        
        init();
    </script>
</body>
</html>
