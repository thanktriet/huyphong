<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tập Luyện - PT Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="layout.js"></script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .tab-active { background-color: #2563eb; color: white; border-color: #2563eb; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3); }
        /* Hiệu ứng tick */
        .set-row { transition: all 0.2s; }
        .set-done { background-color: #eff6ff; border-color: #bfdbfe; }
        .set-done input { color: #2563eb; font-weight: bold; background-color: transparent; }
    </style>
</head>
<body class="bg-slate-50 pb-32">

    <div class="bg-white p-4 sticky top-0 z-20 shadow-sm border-b border-slate-100 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                <i data-lucide="dumbbell" class="text-blue-600 w-6 h-6"></i> Lịch Tập
            </h1>
            <p class="text-xs text-slate-500" id="currentDate">...</p>
        </div>
        <button onclick="resetProgress()" class="text-xs text-red-500 bg-red-50 px-3 py-1.5 rounded-lg font-medium hover:bg-red-100 transition-colors">
            Reset
        </button>
    </div>

    <div class="max-w-md mx-auto px-4 mt-4">
        
        <div class="sticky top-[73px] z-10 bg-slate-50/95 backdrop-blur pt-2 pb-2">
            <div id="tabs" class="flex gap-2 overflow-x-auto no-scrollbar">
                <div class="w-full h-10 bg-slate-200 animate-pulse rounded-lg"></div>
            </div>
        </div>

        <div id="workout-view">
            <div id="todo-list" class="space-y-5 pb-20">
                <p class="text-center text-slate-400 py-10">Đang tải...</p>
            </div>
        </div>

        <div id="history-view" class="hidden space-y-6 animate-in fade-in pb-20"></div>

    </div>

    <div id="floating-action" class="fixed bottom-20 left-0 right-0 px-4 max-w-md mx-auto z-30">
        <div class="bg-white/90 backdrop-blur-sm p-2 rounded-2xl border border-slate-200 shadow-2xl">
            <div class="flex justify-between items-center mb-2 px-2">
                <span class="text-xs font-bold text-slate-500">Đã xong: <span id="selectedCount" class="text-blue-600 text-lg font-black">0</span> sets</span>
                <span class="text-[10px] text-green-600 bg-green-50 px-2 py-0.5 rounded-full font-bold">Auto-save ON</span>
            </div>
            <button onclick="finishWorkout()" id="btnFinish" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2 active:scale-[0.98]">
                <span>Lưu & Hoàn Thành</span> <i data-lucide="check-circle-2" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 safe-area-pb">
        <div class="max-w-md mx-auto flex justify-around items-center h-16">
            <a href="index.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600"><i data-lucide="home" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Home</span></a>
            <a href="workout.html" class="flex flex-col items-center justify-center w-full h-full text-blue-600"><i data-lucide="dumbbell" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">Tập</span></a>
            <a href="nutrition.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600"><i data-lucide="utensils" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Ăn</span></a>
            <a href="schedule.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600"><i data-lucide="calendar" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Lịch</span></a>
            <button onclick="logout()" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-red-500"><i data-lucide="log-out" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Thoát</span></button>
        </div>
    </div>

    <script>
        // --- CẤU HÌNH ---
        const API_URL = "https://script.google.com/macros/s/AKfycbyDv_79EPDM3BzzbYOXevQrocyh60o-qzU63U3N5p7gIuSD2tWhEVKnO1lR7qAJ6qsS/exec"; 

        // --- KHỞI TẠO ---
        lucide.createIcons();
        document.getElementById('currentDate').innerText = `Hôm nay: ${new Date().toLocaleDateString('vi-VN')}`;
        
        const userJson = localStorage.getItem('pt_user');
        if (!userJson) window.location.href = 'login.html';
        const user = JSON.parse(userJson);

        const STORAGE_KEY = `pt_progress_v3_${user.id}`; 
        let PLANS = {};
        let PROGRESS = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        let SET_COUNTS = {}; // Lưu số lượng set của mỗi bài (để biết hiển thị bao nhiêu dòng)
        let CURRENT_TAB = "";

        async function init() {
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'get_student_plan', data: { userId: user.id } }) });
                const result = await res.json();
                if(result.success && result.data) {
                    PLANS = result.data;
                    renderTabs();
                } else {
                    document.getElementById('todo-list').innerHTML = '<div class="text-center text-slate-400 mt-10"><i data-lucide="calendar-off" class="w-12 h-12 mx-auto mb-2 opacity-20"></i><p>Chưa có lịch tập.</p></div>';
                    lucide.createIcons();
                }
                updateCounter();
            } catch(e) { alert("Lỗi tải dữ liệu: " + e); }
        }

        // --- RENDER TABS ---
        function renderTabs() {
            const days = Object.keys(PLANS);
            const container = document.getElementById('tabs');
            let html = days.map((day, i) => `<button onclick="switchTab('${day}', this)" class="px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap border transition-all ${i===0 ? 'tab-active' : 'bg-white text-slate-600 border-slate-200'}">${day}</button>`).join('');
            html += `<button onclick="showHistory(this)" class="px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap border bg-orange-50 text-orange-600 border-orange-200 hover:bg-orange-100 flex items-center gap-1"><i data-lucide="history" class="w-3 h-3"></i> Lịch sử</button>`;
            container.innerHTML = html;
            lucide.createIcons();
            if(days.length > 0) switchTab(days[0], container.children[0]);
        }

        function switchTab(day, btn) {
            CURRENT_TAB = day;
            document.getElementById('history-view').classList.add('hidden');
            document.getElementById('workout-view').classList.remove('hidden');
            document.getElementById('floating-action').classList.remove('hidden');
            updateTabStyles(btn);
            renderExercises(day);
        }

        function updateTabStyles(activeBtn) {
            document.querySelectorAll('#tabs button').forEach(b => {
                b.className = b.innerText.includes('Lịch sử') 
                    ? 'px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap border bg-orange-50 text-orange-600 border-orange-200' 
                    : 'px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap border bg-white text-slate-600 border-slate-200';
            });
            activeBtn.className += ' tab-active transform scale-105 transition-transform';
        }

        // --- RENDER BÀI TẬP (DYNAMIC SETS) ---
        function renderExercises(day) {
            const list = document.getElementById('todo-list');
            const exercises = PLANS[day] || [];
            
            list.innerHTML = exercises.map((ex, i) => {
                const exKey = `${day}_${ex.exercise}`;
                
                // 1. Xác định số lượng set cần hiển thị
                // Mặc định lấy từ giáo án, nhưng nếu trong lịch sử (PROGRESS) có set cao hơn (ví dụ set 5) thì lấy số đó
                let maxSavedSet = 0;
                Object.keys(PROGRESS).forEach(k => {
                    if(k.startsWith(exKey + '_set')) {
                        const num = parseInt(k.split('_set')[1]);
                        if(num > maxSavedSet) maxSavedSet = num;
                    }
                });
                
                // Nếu chưa có trong biến tạm thì khởi tạo
                if (!SET_COUNTS[exKey]) {
                    SET_COUNTS[exKey] = Math.max(ex.sets, maxSavedSet);
                }
                const currentSets = SET_COUNTS[exKey];

                // 2. Tạo HTML cho từng set
                let setsHtml = '';
                for(let s=1; s <= currentSets; s++) {
                    const key = `${exKey}_set${s}`;
                    const saved = PROGRESS[key] || {};
                    const isChecked = saved.checked ? 'checked' : '';
                    const rowClass = saved.checked ? 'set-done' : '';
                    const wVal = saved.weight || '';
                    const rVal = saved.reps || ex.reps;

                    setsHtml += `
                    <div class="set-row flex items-center gap-2 p-2 rounded-lg border border-slate-100 ${rowClass}" id="row-${key}">
                        <div class="w-6 h-6 bg-slate-100 rounded-full flex items-center justify-center text-[10px] font-bold text-slate-500 shadow-sm">
                            ${s}
                        </div>
                        <div class="flex-1 grid grid-cols-2 gap-2">
                            <div class="relative">
                                <input type="number" id="w-${key}" value="${wVal}" oninput="saveTemp('${key}')" 
                                    class="w-full bg-slate-50 border border-slate-200 rounded-md py-1.5 px-2 text-center font-bold text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Kg">
                            </div>
                            <div class="relative">
                                <input type="number" id="r-${key}" value="${rVal}" oninput="saveTemp('${key}')"
                                    class="w-full bg-slate-50 border border-slate-200 rounded-md py-1.5 px-2 text-center font-bold text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Reps">
                            </div>
                        </div>
                        <div>
                            <input type="checkbox" ${isChecked} onchange="toggleSet('${key}', '${ex.exercise}', ${s})" 
                                class="w-6 h-6 rounded border-2 border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer accent-blue-600 block">
                        </div>
                        <button onclick="removeSet('${day}', '${ex.exercise}', ${s})" class="text-slate-300 hover:text-red-500 p-1">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>`;
                }

                return `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-3 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-slate-800">${ex.exercise}</h3>
                            ${ex.note ? `<p class="text-xs text-slate-500 mt-0.5">💡 ${ex.note}</p>` : ''}
                        </div>
                        ${ex.video ? `<a href="${ex.video}" target="_blank" class="text-blue-600 hover:bg-blue-100 p-1.5 rounded-full transition-colors"><i data-lucide="play-circle" class="w-5 h-5"></i></a>` : ''}
                    </div>
                    <div class="p-3 space-y-2">
                        ${setsHtml}
                        <button onclick="addSet('${day}', '${ex.exercise}')" class="w-full py-2 text-xs font-bold text-blue-600 bg-blue-50 rounded-lg hover:bg-blue-100 border border-dashed border-blue-200 flex items-center justify-center gap-1 transition-colors">
                            <i data-lucide="plus" class="w-3 h-3"></i> Thêm Set
                        </button>
                    </div>
                </div>`;
            }).join('');
            
            lucide.createIcons();
            updateCounter();
        }

        // --- LOGIC THÊM / XÓA SET ---

        function addSet(day, exName) {
            const exKey = `${day}_${exName}`;
            SET_COUNTS[exKey]++;
            renderExercises(day); // Render lại để hiện dòng mới
        }

        function removeSet(day, exName, setNumToRemove) {
            const exKey = `${day}_${exName}`;
            if (SET_COUNTS[exKey] <= 1) return alert("Phải có ít nhất 1 set!");
            
            if(confirm(`Xóa Set ${setNumToRemove}?`)) {
                // 1. Xóa data của set bị xóa
                const keyToRemove = `${exKey}_set${setNumToRemove}`;
                delete PROGRESS[keyToRemove];

                // 2. Dồn các set phía sau lên (Ví dụ xóa set 2, thì set 3 thành set 2)
                for (let s = setNumToRemove + 1; s <= SET_COUNTS[exKey]; s++) {
                    const oldKey = `${exKey}_set${s}`;
                    const newKey = `${exKey}_set${s-1}`;
                    if (PROGRESS[oldKey]) {
                        PROGRESS[newKey] = PROGRESS[oldKey];
                        PROGRESS[newKey].setNum = s - 1;
                        delete PROGRESS[oldKey];
                    }
                }

                // 3. Giảm tổng số set
                SET_COUNTS[exKey]--;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(PROGRESS));
                renderExercises(day);
            }
        }

        // --- LOGIC LƯU TRỮ & TICK ---
        
        function saveTemp(key) {
            const w = document.getElementById(`w-${key}`).value;
            const r = document.getElementById(`r-${key}`).value;
            if (!PROGRESS[key]) PROGRESS[key] = {};
            PROGRESS[key].weight = w;
            PROGRESS[key].reps = r;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(PROGRESS));
        }

        function toggleSet(key, exName, setNum) {
            const wInput = document.getElementById(`w-${key}`);
            const rInput = document.getElementById(`r-${key}`);
            const row = document.getElementById(`row-${key}`);

            if (!wInput.value || !rInput.value) {
                alert("Nhập số Kg và Reps trước khi tick!");
                event.target.checked = false;
                wInput.focus();
                return;
            }

            if (event.target.checked) {
                row.classList.add('set-done');
                PROGRESS[key] = { weight: wInput.value, reps: rInput.value, checked: true, exercise: exName, setNum: setNum };
            } else {
                row.classList.remove('set-done');
                if(PROGRESS[key]) PROGRESS[key].checked = false;
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(PROGRESS));
            updateCounter();
        }

        function updateCounter() {
            const count = Object.values(PROGRESS).filter(i => i.checked).length;
            document.getElementById('selectedCount').innerText = count;
            document.getElementById('btnFinish').disabled = count === 0;
        }

        function resetProgress() {
            if(confirm("Xóa toàn bộ dữ liệu nhập tạm thời?")) {
                localStorage.removeItem(STORAGE_KEY);
                PROGRESS = {}; SET_COUNTS = {}; // Reset cả số lượng set đã thêm
                renderExercises(CURRENT_TAB);
                updateCounter();
            }
        }

        async function finishWorkout() {
            const logsToSend = Object.values(PROGRESS).filter(item => item.checked).map(item => ({
                exercise: item.exercise,
                weight: item.weight,
                reps: item.reps
            }));

            if (logsToSend.length === 0) return alert("Chưa hoàn thành set nào!");
            if (!confirm(`Gửi kết quả ${logsToSend.length} sets tập?`)) return;

            const btn = document.getElementById('btnFinish');
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-4 h-4"></i> Đang gửi...';
            btn.disabled = true;

            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'log_workout', data: { userId: user.id, logs: logsToSend } }) });
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'deduct_session', data: { userId: user.id } }) });

                alert("✅ Đã lưu thành công!");
                localStorage.removeItem(STORAGE_KEY); 
                PROGRESS = {}; SET_COUNTS = {};
                
                const historyBtn = document.querySelector("button[onclick='showHistory(this)']");
                if(historyBtn) showHistory(historyBtn);

            } catch(e) { alert("Lỗi: " + e); }
            finally {
                btn.innerHTML = '<span>Lưu & Hoàn Thành</span> <i data-lucide="check-circle-2" class="w-5 h-5"></i>';
                btn.disabled = false;
                updateCounter();
            }
        }

        async function showHistory(btn) {
            CURRENT_TAB = "HISTORY";
            updateTabStyles(btn);
            document.getElementById('workout-view').classList.add('hidden');
            document.getElementById('floating-action').classList.add('hidden');
            const histView = document.getElementById('history-view');
            histView.classList.remove('hidden');
            histView.innerHTML = '<p class="text-center text-slate-400 py-10"><i data-lucide="loader-2" class="animate-spin w-8 h-8 mx-auto mb-2"></i> Đang tải lịch sử...</p>';
            lucide.createIcons();

            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'get_workout_history', data: { userId: user.id } }) });
                const result = await res.json();
                if(result.success && Object.keys(result.data).length > 0) renderHistoryList(result.data);
                else histView.innerHTML = '<p class="text-center text-slate-400 mt-10">Bạn chưa có lịch sử tập luyện nào.</p>';
            } catch(e) { histView.innerHTML = '<p class="text-center text-red-400 mt-10">Lỗi tải lịch sử.</p>'; }
        }

        function renderHistoryList(data) {
            const container = document.getElementById('history-view');
            let html = '';
            Object.keys(data).forEach(date => {
                const logs = data[date];
                html += `<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="bg-slate-100 px-4 py-2 border-b border-slate-200 font-bold text-slate-700 text-sm flex justify-between">
                        <span>${date}</span> <span>${logs.length} sets</span>
                    </div>
                    <div class="divide-y divide-slate-100">`;
                logs.forEach(log => {
                    html += `<div class="p-3 flex justify-between items-center text-sm hover:bg-slate-50">
                        <span class="font-medium text-slate-800">${log.exercise}</span>
                        <span class="bg-blue-50 text-blue-700 px-2 py-1 rounded font-bold text-xs">${log.weight}kg x ${log.reps}</span>
                    </div>`;
                });
                html += `</div></div>`;
            });
            container.innerHTML = html;
        }

        function logout() { if(confirm('Đăng xuất?')) { localStorage.removeItem('pt_user'); window.location.href='login.html'; } }
        init();
    </script>
</body>
</html>
