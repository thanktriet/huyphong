<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Tập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>.no-scrollbar::-webkit-scrollbar { display: none; } .active-tab { background: #2563eb; color: white; border: none; }</style>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
</head>
<body class="bg-slate-50 pb-24">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg px-4 pt-4">
        <h1 class="text-xl font-bold mb-4">Lịch Tập</h1>
        
        <div id="tabs" class="flex gap-2 overflow-x-auto no-scrollbar pb-2 mb-4"></div>
        
        <div id="list" class="space-y-3 pb-20">Đang tải...</div>

        <div class="fixed bottom-20 left-0 right-0 px-4 max-w-md mx-auto">
            <button onclick="finish()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg">Hoàn Thành Buổi Tập</button>
        </div>
    </div>

    <script>
        renderLayout('workout');
        let PLANS = {}, LOGS = [];

        async function init() {
            const res = await callAPI('get_student_plan', { userId: USER.id });
            if(res.success && res.data) {
                PLANS = res.data;
                renderTabs();
            } else {
                document.getElementById('list').innerHTML = '<p class="text-center text-gray-400">Chưa có lịch tập.</p>';
            }
        }

        function renderTabs() {
            const tabs = document.getElementById('tabs');
            const days = Object.keys(PLANS);
            tabs.innerHTML = days.map((d, i) => 
                `<button onclick="renderList('${d}', this)" class="px-4 py-2 rounded-lg border text-sm font-bold whitespace-nowrap ${i===0?'active-tab':''}">
                    ${d}
                </button>`
            ).join('');
            renderList(days[0]);
        }

        function renderList(day, btn) {
            if(btn) {
                document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active-tab'));
                btn.classList.add('active-tab');
            }
            const list = document.getElementById('list');
            list.innerHTML = PLANS[day].map((ex, i) => `
                <div class="border rounded-xl p-4 bg-white shadow-sm" id="card-${i}">
                    <div class="flex justify-between">
                        <h3 class="font-bold">${ex.exercise}</h3>
                        ${ex.video ? `<a href="${ex.video}" target="_blank" class="text-blue-500"><i data-lucide="play-circle"></i></a>` : ''}
                    </div>
                    <div class="flex gap-2 mt-2 items-center">
                        <input id="w-${i}" type="number" placeholder="Kg" class="border rounded p-2 w-20 text-center">
                        <input id="r-${i}" type="number" placeholder="Reps" value="${ex.reps}" class="border rounded p-2 w-16 text-center">
                        <input type="checkbox" onchange="toggle(${i}, '${ex.exercise}')" class="w-6 h-6 ml-auto">
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function toggle(i, name) {
            const w = document.getElementById(`w-${i}`).value || 0;
            const r = document.getElementById(`r-${i}`).value || 0;
            const card = document.getElementById(`card-${i}`);
            
            if(event.target.checked) {
                card.classList.add('bg-green-50', 'border-green-500');
                LOGS.push({ exercise: name, weight: w, reps: r });
            } else {
                card.classList.remove('bg-green-50', 'border-green-500');
                LOGS = LOGS.filter(l => l.exercise !== name);
            }
        }

        async function finish() {
            if(LOGS.length === 0) return alert('Chưa tập bài nào!');
            await callAPI('log_workout', { userId: USER.id, logs: LOGS });
            await callAPI('deduct_session', { userId: USER.id });
            alert('Đã lưu thành công!');
            window.location.reload();
        }

        init();
    </script>
</body>
</html>
