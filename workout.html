<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tập Luyện - PT Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Load Core System -->
    <script src="js/core/config.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/api.js"></script>
    <!-- supabase/api.js will be loaded by API.init() -->
    <script src="js/services/auth.service.js"></script>
    <script src="js/services/workout.service.js"></script>
    <script src="js/ui/toast.js"></script>
    <script src="js/ui/loader.js"></script>
    <script src="js/pages/workout.page.js"></script>

    <link rel="stylesheet" href="css/mobile.css">
    <style>
        /* Tiện ích */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .tab-active { background-color: #2563eb; color: white; border-color: #2563eb; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3); }
        
        /* Hiệu ứng set tập */
        .set-row { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-left: 3px solid transparent; }
        .set-done { background-color: #f0f9ff; border-left-color: #3b82f6; opacity: 0.8; }
        .set-done input { color: #2563eb; font-weight: bold; background: transparent; }
        
        /* Input số (ẩn mũi tên mặc định) */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* Timer Animation */
        @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.2); opacity: 0; } }
        .timer-ring::before { content: ''; position: absolute; left: -5px; top: -5px; right: -5px; bottom: -5px; border-radius: 50%; border: 2px solid #3b82f6; animation: pulse-ring 2s infinite; }

        /* Modal Ảnh */
        #modal-image { backdrop-filter: blur(5px); transition: opacity 0.3s; }
        .img-zoom { max-height: 80vh; max-width: 90vw; object-fit: contain; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
        
        /* Mobile optimizations */
        @media (max-width: 640px) {
            body { padding-bottom: 6rem; }
            .max-w-md { max-width: 100%; }
            #tabs { gap: 0.5rem; padding: 0.5rem 0; }
            #tabs button { padding: 0.75rem 1rem; font-size: 14px; min-width: 80px; }
            #floating-action { left: 1rem; right: 1rem; }
        }
    </style>
</head>
<body class="bg-slate-100 pb-36 font-sans text-slate-800 select-none">

    <div class="bg-white px-4 pt-4 pb-2 sticky top-0 z-20 shadow-sm border-b border-slate-100">
        <div class="flex justify-between items-center max-w-md mx-auto mb-2">
            <div>
                <h1 class="text-xl font-black text-slate-900 flex items-center gap-2 tracking-tight">
                    <i data-lucide="dumbbell" class="text-blue-600 w-6 h-6"></i> Lịch Tập
                </h1>
                <p class="text-xs text-slate-500 font-medium" id="currentDate">...</p>
            </div>
            <button onclick="WorkoutPage.resetProgress()" class="p-2 text-slate-400 hover:text-red-500 transition-colors" title="Làm mới">
                <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
            </button>
        </div>
        
        <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
            <div id="total-progress" class="h-full bg-blue-600 transition-all duration-500" style="width: 0%"></div>
        </div>
    </div>

    <div class="max-w-md mx-auto px-3 mt-3">
        
        <div class="sticky top-[85px] z-10 bg-slate-100/95 backdrop-blur py-2 -mx-3 px-3 shadow-sm">
            <div id="tabs" class="flex gap-2 overflow-x-auto no-scrollbar">
                <div class="w-24 h-9 bg-slate-200 animate-pulse rounded-lg flex-shrink-0"></div>
                <div class="w-24 h-9 bg-slate-200 animate-pulse rounded-lg flex-shrink-0"></div>
            </div>
        </div>

        <div id="workout-view" class="mt-2">
            <div id="todo-list" class="space-y-4 pb-20">
                <div class="text-center py-10 space-y-3">
                    <div class="animate-spin w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full mx-auto"></div>
                    <p class="text-slate-400 text-sm">Đang tải giáo án...</p>
                </div>
            </div>
        </div>

        <div id="history-view" class="hidden space-y-4 animate-in fade-in pb-20 mt-4"></div>

    </div>

    <div id="modal-image" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/90 p-4 animate-in fade-in duration-200" onclick="WorkoutPage.closeImageModal()">
        <div class="relative flex flex-col items-center" onclick="event.stopPropagation()">
            <button onclick="WorkoutPage.closeImageModal()" class="absolute -top-12 right-0 bg-white/10 hover:bg-white/20 text-white p-2 rounded-full backdrop-blur-md transition-colors">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            
            <img id="img-preview" src="" class="img-zoom bg-white">
            
            <p class="text-white/70 text-sm mt-4 text-center">Bấm ra ngoài để đóng</p>
        </div>
    </div>

    <div id="rest-timer-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm hidden transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-8 text-center shadow-2xl w-72 relative">
            <div class="relative inline-block mb-6 timer-ring">
                <div class="w-24 h-24 rounded-full border-4 border-blue-100 flex items-center justify-center bg-white relative z-10">
                    <span id="timer-count" class="text-4xl font-black text-blue-600 tabular-nums">60</span>
                </div>
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-1">Nghỉ ngơi nào...</h3>
            <p class="text-xs text-slate-500 mb-6">Thả lỏng cơ bắp và hít thở sâu</p>
            
            <div class="flex gap-3 justify-center">
                <button onclick="WorkoutPage.addTime(10)" class="px-4 py-2 bg-slate-100 rounded-xl text-slate-600 font-bold text-sm hover:bg-slate-200">+10s</button>
                <button onclick="WorkoutPage.stopTimer()" class="px-6 py-2 bg-blue-600 text-white rounded-xl font-bold text-sm hover:bg-blue-700 shadow-lg shadow-blue-200">Tiếp tục</button>
            </div>
        </div>
    </div>

    <div id="floating-action" class="fixed bottom-20 left-4 right-4 max-w-md mx-auto z-30 transition-transform duration-300 translate-y-0">
        <div class="bg-slate-900 text-white p-3 rounded-2xl shadow-2xl flex items-center justify-between gap-3 pr-1">
            <div class="pl-2">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Hoàn thành</p>
                <p class="text-lg font-bold leading-none"><span id="selectedCount" class="text-blue-400">0</span> <span class="text-sm text-slate-500 font-normal">sets</span></p>
            </div>
            <button onclick="WorkoutPage.finishWorkout()" id="btnFinish" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-bold shadow-lg flex items-center gap-2 transition-all disabled:opacity-50 disabled:grayscale active:scale-95">
                <span>Lưu Buổi Tập</span> <i data-lucide="check" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 safe-area-pb bottom-nav">
        <div class="max-w-md mx-auto flex justify-around items-center h-16 px-2">
            <a href="index.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600 transition-colors active:bg-slate-50 rounded-lg">
                <i data-lucide="home" class="w-6 h-6 mb-0.5"></i>
                <span class="text-[10px] font-medium">Home</span>
            </a>
            <a href="workout.html" class="flex flex-col items-center justify-center w-full h-full text-blue-600 transition-colors active:bg-blue-50 rounded-lg">
                <i data-lucide="dumbbell" class="w-6 h-6 mb-0.5"></i>
                <span class="text-[10px] font-bold">Tập</span>
            </a>
            <a href="nutrition.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600 transition-colors active:bg-slate-50 rounded-lg">
                <i data-lucide="utensils" class="w-6 h-6 mb-0.5"></i>
                <span class="text-[10px] font-medium">Ăn</span>
            </a>
            <a href="schedule.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600 transition-colors active:bg-slate-50 rounded-lg">
                <i data-lucide="calendar" class="w-6 h-6 mb-0.5"></i>
                <span class="text-[10px] font-medium">Lịch</span>
            </a>
            <button onclick="AuthService.logout()" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-red-500 transition-colors active:bg-red-50 rounded-lg">
                <i data-lucide="log-out" class="w-6 h-6 mb-0.5"></i>
                <span class="text-[10px] font-medium">Thoát</span>
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('vi-VN', {weekday: 'long', day: 'numeric', month: 'numeric'});
        
        // Initialize page
        (async function() {
            await API.init();
            await WorkoutPage.init();
        })();
    </script>
</body>
</html>
