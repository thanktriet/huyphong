<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 pb-10">
    <div class="bg-slate-900 text-white p-6 shadow-lg flex justify-between items-center">
        <h1 class="text-xl font-bold flex gap-2 items-center"><i data-lucide="shield-alert" class="text-yellow-400"></i> PT Control</h1>
        <button onclick="logout()" class="bg-slate-800 p-2 rounded"><i data-lucide="log-out"></i></button>
    </div>

    <div class="max-w-2xl mx-auto px-4 -mt-6">
        <div class="bg-white p-6 rounded-xl shadow-md mb-6">
            <h3 class="font-bold mb-4 text-blue-600">Thêm Học Viên Mới</h3>
            <form id="formReg" class="space-y-3">
                <input id="newName" class="w-full border p-2 rounded" placeholder="Họ Tên" required>
                <input id="newEmail" class="w-full border p-2 rounded" placeholder="Email" required>
                <input id="newPhone" class="w-full border p-2 rounded" placeholder="SĐT" required>
                <button class="w-full bg-blue-600 text-white font-bold py-2 rounded">Lưu</button>
            </form>
        </div>

        <div class="bg-white rounded-xl shadow border overflow-hidden">
            <table class="w-full text-sm">
                <thead class="bg-slate-50 border-b"><tr><th class="p-4 text-left">Học Viên</th><th class="p-4">Buổi</th></tr></thead>
                <tbody id="list"><tr><td colspan="2" class="p-4 text-center">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const API_URL = "https://script.google.com/macros/s/AKfycbyDv_79EPDM3BzzbYOXevQrocyh60o-qzU63U3N5p7gIuSD2tWhEVKnO1lR7qAJ6qsS/exec";
        const user = JSON.parse(localStorage.getItem('pt_user'));
        if(!user || user.role !== 'PT') { alert('Cấm truy cập!'); window.location.href='index.html'; }

        async function load() {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'get_all_students' }) });
            const r = await res.json();
            const list = document.getElementById('list');
            list.innerHTML = r.data.map(s => `
                <tr class="border-b hover:bg-slate-50">
                    <td class="p-4"><b>${s.name}</b><br><span class="text-xs text-gray-500">${s.email}</span></td>
                    <td class="p-4 text-center"><span class="bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold">${s.sessionLeft||0}</span></td>
                </tr>`).join('');
        }

        document.getElementById('formReg').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = { name: document.getElementById('newName').value, email: document.getElementById('newEmail').value, phone: document.getElementById('newPhone').value };
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'register', data }) });
            alert('Thêm thành công!'); load(); document.getElementById('formReg').reset();
        });

        function logout() { localStorage.removeItem('pt_user'); window.location.href='login.html'; }
        load();
    </script>
</body>
</html>
