<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - PT Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .tab-btn.active { background-color: #2563eb; color: white; border-color: #2563eb; }
        /* Table Scroll */
        .table-container { max-height: 400px; overflow-y: auto; }
        /* Calendar */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-left: 1px solid #e2e8f0; border-top: 1px solid #e2e8f0; }
        .calendar-cell { background-color: white; min-height: 100px; padding: 4px; border-right: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; cursor: pointer; transition: all 0.2s; }
        .calendar-cell:hover { background-color: #f1f5f9; }
        .event-tag { font-size: 10px; padding: 2px 4px; margin-bottom: 2px; border-radius: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; background: #eff6ff; color: #1d4ed8; border-left: 2px solid #3b82f6; }
        .modal { transition: opacity 0.2s ease; }
        body.modal-active { overflow: hidden; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 pb-20">

    <div class="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-lg">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg"><i data-lucide="shield-alert" class="w-6 h-6 text-white"></i></div>
                <div><h1 class="text-lg font-bold leading-tight">PT Control</h1><p class="text-slate-400 text-xs">Hello, <span id="ptName">Coach</span></p></div>
            </div>
            <button onclick="logout()" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-lg"><i data-lucide="log-out" class="w-5 h-5"></i></button>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-4 mt-6 space-y-6">
        <div class="flex gap-2 overflow-x-auto no-scrollbar bg-white p-2 rounded-xl shadow-sm">
            <button onclick="switchTab('calendar', this)" class="tab-btn active flex-1 py-2 px-4 rounded-lg text-sm font-bold text-slate-500 hover:bg-slate-50 flex justify-center gap-2 whitespace-nowrap"><i data-lucide="calendar-days" class="w-4 h-4"></i> Lịch Dạy</button>
            <button onclick="switchTab('builder', this)" class="tab-btn flex-1 py-2 px-4 rounded-lg text-sm font-bold text-slate-500 hover:bg-slate-50 flex justify-center gap-2 whitespace-nowrap"><i data-lucide="pencil-ruler" class="w-4 h-4"></i> Giáo Án</button>
            <button onclick="switchTab('students', this)" class="tab-btn flex-1 py-2 px-4 rounded-lg text-sm font-bold text-slate-500 hover:bg-slate-50 flex justify-center gap-2 whitespace-nowrap"><i data-lucide="users" class="w-4 h-4"></i> Học Viên</button>
            <button onclick="switchTab('exercise', this)" class="tab-btn flex-1 py-2 px-4 rounded-lg text-sm font-bold text-slate-500 hover:bg-slate-50 flex justify-center gap-2 whitespace-nowrap"><i data-lucide="dumbbell" class="w-4 h-4"></i> Bài Tập</button>
            <button onclick="switchTab('food', this)" class="tab-btn flex-1 py-2 px-4 rounded-lg text-sm font-bold text-slate-500 hover:bg-slate-50 flex justify-center gap-2 whitespace-nowrap"><i data-lucide="utensils" class="w-4 h-4"></i> Món Ăn</button>
        </div>

        <div id="view-calendar" class="view-section space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-full"><i data-lucide="chevron-left"></i></button>
                    <h2 class="text-xl font-bold text-slate-800 uppercase" id="cal-title">...</h2>
                    <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-full"><i data-lucide="chevron-right"></i></button>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="calendar-grid bg-slate-50 border-b"><div class="calendar-header text-red-500">CN</div><div class="calendar-header">T2</div><div class="calendar-header">T3</div><div class="calendar-header">T4</div><div class="calendar-header">T5</div><div class="calendar-header">T6</div><div class="calendar-header">T7</div></div>
                <div id="calendar-body" class="calendar-grid"></div>
            </div>
        </div>

        <div id="view-builder" class="view-section hidden space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2"><i data-lucide="plus-circle" class="text-blue-600"></i> Tạo Giáo Án Mới</h2>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <input id="plan-name" class="border p-2 rounded text-sm font-bold" placeholder="Tên Giáo Án">
                    <select id="plan-student" class="border p-2 rounded text-sm bg-white"><option value="">-- Chọn Học Viên --</option></select>
                </div>
                <div class="border rounded-xl overflow-hidden mb-4">
                    <table class="w-full text-sm text-left"><tbody id="plan-rows" class="divide-y divide-slate-100"></tbody></table>
                    <button onclick="addPlanRow()" class="w-full py-2 bg-slate-50 text-blue-600 text-xs font-bold border-t">+ Thêm bài tập</button>
                </div>
                <button onclick="savePlan()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-blue-700">Lưu & Gửi</button>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-700 mb-4">Giáo Án Đã Giao</h2>
                <div class="table-container">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-slate-50 sticky top-0"><tr><th class="p-3">Tên Plan</th><th class="p-3">Học Viên</th><th class="p-3 text-right">Xóa</th></tr></thead>
                        <tbody id="plan-list" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="view-students" class="view-section hidden space-y-4">
            <div class="flex justify-between items-center"><h2 class="text-lg font-bold text-slate-700">Danh sách</h2><button onclick="toggleModal('modal-add-student')" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold flex gap-2 shadow-lg"><i data-lucide="user-plus" class="w-4 h-4"></i> Thêm</button></div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-sm text-left">
                    <thead class="bg-slate-50 font-bold"><tr><th class="p-4">Học viên</th><th class="p-4 text-center">Trạng thái</th><th class="p-4 text-right">Thao tác</th></tr></thead>
                    <tbody id="student-list" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>

        <div id="view-exercise" class="view-section hidden grid grid-cols-3 gap-6">
            <div class="col-span-1 bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
                <h2 class="text-lg font-bold text-slate-700 mb-4">Thêm Bài Tập</h2>
                <form id="form-exercise" class="space-y-4">
                    <input id="ex-name" class="w-full border p-2.5 rounded-lg text-sm" placeholder="Tên bài" required>
                    <select id="ex-group" class="w-full border p-2.5 rounded-lg text-sm"><option>Ngực</option><option>Lưng</option><option>Chân</option><option>Vai</option><option>Tay</option><option>Bụng</option></select>
                    <input id="ex-video" class="w-full border p-2.5 rounded-lg text-sm" placeholder="Youtube URL">
                    <button class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">Thêm Mới</button>
                </form>
            </div>
            <div class="col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between mb-4"><h2 class="text-lg font-bold text-slate-700">Kho Bài Tập</h2><input id="search-ex" onkeyup="filterTable('ex-list', this.value)" class="border p-2 rounded text-sm" placeholder="Tìm kiếm..."></div>
                <div class="table-container">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-slate-50 sticky top-0"><tr><th class="p-3">Tên</th><th class="p-3">Nhóm</th><th class="p-3 text-right">Xóa</th></tr></thead>
                        <tbody id="ex-list" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="view-food" class="view-section hidden grid grid-cols-3 gap-6">
            <div class="col-span-1 bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
                <h2 class="text-lg font-bold text-slate-700 mb-4">Thêm Món Ăn</h2>
                <form id="form-food" class="space-y-4">
                    <input id="fd-name" class="w-full border p-2.5 rounded-lg text-sm" placeholder="Tên món" required>
                    <div class="grid grid-cols-2 gap-2"><input id="fd-cal" type="number" class="border p-2 rounded text-sm" placeholder="Calo" required><input id="fd-unit" class="border p-2 rounded text-sm" value="100g"></div>
                    <button class="w-full bg-green-600 text-white font-bold py-3 rounded-xl">Thêm Mới</button>
                </form>
            </div>
            <div class="col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between mb-4"><h2 class="text-lg font-bold text-slate-700">Kho Món Ăn</h2><input id="search-fd" onkeyup="filterTable('fd-list', this.value)" class="border p-2 rounded text-sm" placeholder="Tìm kiếm..."></div>
                <div class="table-container">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-slate-50 sticky top-0"><tr><th class="p-3">Tên</th><th class="p-3">Calo</th><th class="p-3 text-right">Xóa</th></tr></thead>
                        <tbody id="fd-list" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-add-student" class="modal opacity-0 pointer-events-none fixed inset-0 flex items-center justify-center z-50"><div class="absolute inset-0 bg-slate-900 opacity-50"></div><div class="bg-white w-11/12 max-w-md rounded-2xl shadow-2xl z-50 p-6 relative"><button onclick="toggleModal('modal-add-student')" class="absolute top-4 right-4 text-slate-400"><i data-lucide="x"></i></button><h3 class="text-lg font-bold text-slate-800 mb-4">Thêm Học Viên</h3><form id="form-register" class="space-y-3"><input id="reg-name" class="w-full border p-3 rounded-xl text-sm" placeholder="Họ tên" required><input id="reg-email" class="w-full border p-3 rounded-xl text-sm" placeholder="Email" required><input id="reg-phone" class="w-full border p-3 rounded-xl text-sm" placeholder="SĐT" required><button class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">Tạo</button></form></div></div>
    <div id="modal-book" class="modal opacity-0 pointer-events-none fixed inset-0 flex items-center justify-center z-50"><div class="absolute inset-0 bg-slate-900 opacity-50"></div><div class="bg-white w-11/12 max-w-sm rounded-2xl shadow-2xl z-50 p-6 relative"><button onclick="toggleModal('modal-book')" class="absolute top-4 right-4 text-slate-400"><i data-lucide="x"></i></button><h3 class="text-lg font-bold mb-4">Đặt Lịch</h3><form id="form-book" class="space-y-3"><input id="bk-date" type="date" class="w-full border p-2 rounded" readonly><input id="bk-time" type="time" class="w-full border p-2 rounded"><select id="bk-student" class="w-full border p-2 rounded"></select><button class="w-full bg-blue-600 text-white font-bold py-2 rounded-xl">Lưu</button></form></div></div>

    <datalist id="dl-exercises"></datalist>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyDv_79EPDM3BzzbYOXevQrocyh60o-qzU63U3N5p7gIuSD2tWhEVKnO1lR7qAJ6qsS/exec"; 
        lucide.createIcons();
        const USER = JSON.parse(localStorage.getItem('pt_user'));
        if(!USER || USER.role !== 'PT') window.location.href = 'login.html';
        document.getElementById('ptName').innerText = USER.name;

        let STUDENTS = [], SCHEDULE_DATA = [], EXERCISES = [], FOODS = [], PLANS = [], STUDENTS_MAP = {};
        let CURRENT_DATE = new Date();

        async function callAPI(action, data={}) { try { const r=await fetch(API_URL, {method:'POST', body:JSON.stringify({action,data})}); return await r.json(); } catch(e){ alert("Lỗi: "+e); return {success:false}; } }

        async function initApp() {
            await Promise.all([loadStudents(), loadSchedule(), loadExercises(), loadFoods(), loadPlans()]);
            addPlanRow();
        }

        // --- LOADER FUNCTIONS ---
        async function loadStudents() {
            const res = await callAPI('get_all_students');
            if(res.success) {
                STUDENTS = res.data;
                STUDENTS_MAP = {}; STUDENTS.forEach(s => STUDENTS_MAP[s.id] = s.name);
                const opts = '<option value="">-- Chọn --</option>' + STUDENTS.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
                document.getElementById('plan-student').innerHTML = opts;
                document.getElementById('bk-student').innerHTML = opts;
                document.getElementById('student-list').innerHTML = STUDENTS.map(st => `
                    <tr class="hover:bg-slate-50 border-b border-slate-50"><td class="p-4"><b>${st.name}</b><br><span class="text-xs text-slate-400">${st.email}</span><br><span class="text-[10px] ${st.isExpired?'text-red-500':'text-green-600'} font-bold">${st.isExpired?'Hết hạn':'Hạn: '+st.expiryDate}</span></td><td class="p-4 text-center text-blue-600 font-bold">${st.sessionLeft}</td><td class="p-4 text-right"><div class="flex gap-1 justify-end"><button onclick="topUp('${st.id}','${st.name}')" class="bg-blue-50 text-blue-600 text-xs px-2 py-1 rounded">Buổi</button><button onclick="topUpMonth('${st.id}','${st.name}')" class="bg-green-50 text-green-600 text-xs px-2 py-1 rounded">Tháng</button></div></td></tr>
                `).join('');
            }
        }

        async function loadExercises() {
            const res = await callAPI('get_all_exercises');
            if(res.success) {
                EXERCISES = res.data;
                document.getElementById('dl-exercises').innerHTML = EXERCISES.map(e=>`<option value="${e.name}">`).join('');
                document.getElementById('ex-list').innerHTML = EXERCISES.map(e => `<tr class="border-b hover:bg-slate-50"><td class="p-3">${e.name}</td><td class="p-3 text-slate-500">${e.group}</td><td class="p-3 text-right"><button onclick="deleteItem('exercise','${e.id}')" class="text-red-400 hover:text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td></tr>`).join('');
                lucide.createIcons();
            }
        }

        async function loadFoods() {
            const res = await callAPI('get_all_foods');
            if(res.success) {
                FOODS = res.data;
                document.getElementById('fd-list').innerHTML = FOODS.map(f => `<tr class="border-b hover:bg-slate-50"><td class="p-3">${f.name}</td><td class="p-3 font-bold text-slate-600">${f.cal} <span class="text-xs font-normal">/ ${f.unit}</span></td><td class="p-3 text-right"><button onclick="deleteItem('food','${f.id}')" class="text-red-400 hover:text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td></tr>`).join('');
                lucide.createIcons();
            }
        }

        async function loadPlans() {
            const res = await callAPI('get_all_plans');
            if(res.success) {
                PLANS = res.data;
                document.getElementById('plan-list').innerHTML = PLANS.map(p => `<tr class="border-b hover:bg-slate-50"><td class="p-3 font-bold text-blue-600">${p.name}</td><td class="p-3">${STUDENTS_MAP[p.userId]||p.userId}</td><td class="p-3 text-right"><button onclick="deleteItem('plan','${p.id}')" class="text-red-400 hover:text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td></tr>`).join('');
                lucide.createIcons();
            }
        }

        // --- ACTION FUNCTIONS ---
        async function deleteItem(type, id) {
            if(!confirm("Xóa mục này?")) return;
            const res = await callAPI(`admin_delete_${type}`, {id});
            if(res.success) { alert("Đã xóa!"); if(type=='exercise') loadExercises(); if(type=='food') loadFoods(); if(type=='plan') loadPlans(); }
        }

        // ... (Các hàm TopUp, Register, SavePlan, Calendar như bản cũ, giữ nguyên logic) ...
        async function topUp(id, name) { const a=prompt(`Nạp buổi cho ${name}?`,"10"); if(a) { await callAPI('admin_update_student',{studentId:id,addSession:a}); loadStudents(); }}
        async function topUpMonth(id, name) { const m=prompt(`Gia hạn tháng cho ${name}?`,"1"); if(m) { await callAPI('admin_update_student',{studentId:id,addMonth:m}); loadStudents(); }}
        
        document.getElementById('form-exercise').addEventListener('submit', async(e)=>{ e.preventDefault(); await callAPI('admin_add_exercise', {name:document.getElementById('ex-name').value, group:document.getElementById('ex-group').value, video:document.getElementById('ex-video').value}); loadExercises(); document.getElementById('form-exercise').reset(); });
        document.getElementById('form-food').addEventListener('submit', async(e)=>{ e.preventDefault(); await callAPI('admin_add_food', {name:document.getElementById('fd-name').value, cal:document.getElementById('fd-cal').value, unit:document.getElementById('fd-unit').value}); loadFoods(); document.getElementById('form-food').reset(); });

        // Calendar & Plan Builder Logic (Rút gọn để vừa file)
        function addPlanRow() { document.getElementById('plan-rows').insertAdjacentHTML('beforeend', `<tr><td class="p-2"><select class="w-full border p-1 rounded"><option>Thứ 2</option><option>Thứ 3</option><option>Thứ 4</option><option>Thứ 5</option><option>Thứ 6</option><option>Thứ 7</option></select></td><td class="p-2"><input list="dl-exercises" class="w-full border p-1 rounded font-bold"></td><td class="p-2"><input type="number" value="3" class="w-full border p-1 rounded text-center"></td><td class="p-2"><input type="number" value="10" class="w-full border p-1 rounded text-center"></td><td class="p-2"><input class="w-full border p-1 rounded"></td><td class="p-2"><button onclick="this.closest('tr').remove()"><i data-lucide="trash-2" class="w-4 h-4 text-red-400"></i></button></td></tr>`); lucide.createIcons(); }
        async function savePlan() { const name=document.getElementById('plan-name').value, uId=document.getElementById('plan-student').value; if(!name||!uId) return alert("Nhập tên & chọn HV!"); const details=Array.from(document.querySelectorAll('#plan-rows tr')).map(r=>{const i=r.querySelectorAll('input,select');return {day:i[0].value, exercise:i[1].value, sets:i[2].value, reps:i[3].value, note:i[4].value}}).filter(d=>d.exercise); await callAPI('save_workout_plan',{planName:name, targetUser:uId, details}); alert("Đã lưu!"); loadPlans(); }
        
        async function loadSchedule() { const r=await callAPI('get_schedule'); SCHEDULE_DATA=r.success?r.data:[]; renderCalendar(); }
        function renderCalendar() {
            const y=CURRENT_DATE.getFullYear(), m=CURRENT_DATE.getMonth(), fd=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate();
            document.getElementById('cal-title').innerText=`Tháng ${m+1}/${y}`;
            const b=document.getElementById('calendar-body'); b.innerHTML='';
            for(let i=0;i<fd;i++) b.innerHTML+=`<div class="calendar-cell bg-slate-50"></div>`;
            for(let d=1;d<=dim;d++) {
                const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const evs=SCHEDULE_DATA.filter(e=>e.date===ds).map(e=>`<div class="event-tag bg-blue-50 text-blue-600 border-l-2 border-blue-500" onclick="event.stopPropagation();cancelSession('${e.id}')"><span>${e.time}</span> ${STUDENTS_MAP[e.userId]?.split(' ').pop()}</div>`).join('');
                b.innerHTML+=`<div class="calendar-cell group" onclick="openBook('${ds}')"><div class="font-bold text-slate-400 text-xs">${d}</div><div class="space-y-1 mt-1">${evs}</div></div>`;
            }
        }
        function openBook(ds) { document.getElementById('bk-date').value=ds; document.getElementById('bk-time').value="18:00"; toggleModal('modal-book'); }
        document.getElementById('form-book').addEventListener('submit', async(e)=>{ e.preventDefault(); await callAPI('book_session',{userId:document.getElementById('bk-student').value, date:document.getElementById('bk-date').value, time:document.getElementById('bk-time').value}); alert("OK"); toggleModal('modal-book'); loadSchedule(); });
        async function cancelSession(id) { if(confirm("Hủy?")) { await callAPI('cancel_session',{bookingId:id}); loadSchedule(); }}
        function changeMonth(s) { CURRENT_DATE.setMonth(CURRENT_DATE.getMonth()+s); renderCalendar(); }

        // UTILS
        function switchTab(n,b) { document.querySelectorAll('.view-section').forEach(e=>e.classList.add('hidden')); document.getElementById(`view-${n}`).classList.remove('hidden'); document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active')); b.classList.add('active'); }
        function toggleModal(id) { const m=document.getElementById(id); m.classList.toggle('opacity-0'); m.classList.toggle('pointer-events-none'); }
        function filterTable(id, k) { const tr=document.querySelectorAll(`#${id} tr`); tr.forEach(r=>r.style.display=r.innerText.toLowerCase().includes(k.toLowerCase())?'':'none'); }
        function logout() { localStorage.removeItem('pt_user'); window.location.href='login.html'; }

        initApp();
    </script>
</body>
</html>
