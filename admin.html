<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - PT Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .tab-btn.active { background-color: #2563eb; color: white; border-color: #2563eb; }
        
        /* CALENDAR */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-left: 1px solid #e2e8f0; border-top: 1px solid #e2e8f0; }
        .calendar-cell { 
            background-color: white; min-height: 110px; padding: 6px; border-right: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; 
            position: relative; transition: all 0.2s; cursor: pointer; 
        }
        .calendar-cell:hover { background-color: #f8fafc; }
        .calendar-cell:hover::after {
            content: "+"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 24px; color: #cbd5e1; font-weight: bold; opacity: 0; transition: opacity 0.2s;
        }
        .calendar-cell:hover::after { opacity: 1; }
        
        .event-tag { 
            padding: 3px 6px; margin-bottom: 2px; border-radius: 4px; 
            font-size: 10px; font-weight: 600; display: flex; align-items: center; gap: 4px;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
        }
        .evt-upcoming { background-color: #eff6ff; color: #1d4ed8; border-left: 2px solid #3b82f6; }
        .evt-completed { background-color: #f1f5f9; color: #64748b; border-left: 2px solid #94a3b8; opacity: 0.7; }
        .evt-cancelled { background-color: #fef2f2; color: #ef4444; border-left: 2px solid #f87171; opacity: 0.7; text-decoration: line-through; }

        .modal { transition: opacity 0.2s ease; }
        body.modal-active { overflow: hidden; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 pb-20">

    <div class="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-lg">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg"><i data-lucide="shield-alert" class="w-6 h-6 text-white"></i></div>
                <div><h1 class="text-lg font-bold leading-tight">PT Control</h1><p class="text-slate-400 text-xs">Xin chào, <span id="ptName">Coach</span></p></div>
            </div>
            <button onclick="logout()" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-lg"><i data-lucide="log-out" class="w-5 h-5"></i></button>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-4 mt-6 space-y-6">
        
        <div class="grid grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border-b-4 border-blue-500"><div class="text-slate-400 text-xs font-bold uppercase mb-1">Tổng HV</div><div class="text-3xl font-black text-slate-800" id="stat-total">...</div></div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-b-4 border-green-500"><div class="text-slate-400 text-xs font-bold uppercase mb-1">Active</div><div class="text-3xl font-black text-slate-800" id="stat-active">...</div></div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-b-4 border-orange-500"><div class="text-slate-400 text-xs font-bold uppercase mb-1">Hôm Nay</div><div class="text-3xl font-black text-slate-800" id="stat-today">...</div></div>
        </div>

        <div class="flex gap-2 overflow-x-auto no-scrollbar bg-white p-2 rounded-xl shadow-sm">
            <button onclick="switchTab('calendar', this)" class="tab-btn active flex-1 py-2 px-4 rounded-lg text-sm font-bold text-slate-500 hover:bg-slate-50 flex justify-center gap-2 whitespace-nowrap"><i data-lucide="calendar-days" class="w-4 h-4"></i> Lịch Dạy</button>
            <button onclick="switchTab('builder', this)" class="tab-btn flex-1 py-2 px-4 rounded-lg text-sm font-bold text-slate-500 hover:bg-slate-50 flex justify-center gap-2 whitespace-nowrap"><i data-lucide="pencil-ruler" class="w-4 h-4"></i> Giáo Án</button>
            <button onclick="switchTab('students', this)" class="tab-btn flex-1 py-2 px-4 rounded-lg text-sm font-bold text-slate-500 hover:bg-slate-50 flex justify-center gap-2 whitespace-nowrap"><i data-lucide="users" class="w-4 h-4"></i> Học Viên</button>
            <button onclick="switchTab('exercise', this)" class="tab-btn flex-1 py-2 px-4 rounded-lg text-sm font-bold text-slate-500 hover:bg-slate-50 flex justify-center gap-2 whitespace-nowrap"><i data-lucide="dumbbell" class="w-4 h-4"></i> Bài Tập</button>
            <button onclick="switchTab('food', this)" class="tab-btn flex-1 py-2 px-4 rounded-lg text-sm font-bold text-slate-500 hover:bg-slate-50 flex justify-center gap-2 whitespace-nowrap"><i data-lucide="utensils" class="w-4 h-4"></i> Món Ăn</button>
        </div>

        <div id="view-calendar" class="view-section space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-full"><i data-lucide="chevron-left"></i></button>
                    <h2 class="text-xl font-bold text-slate-800 uppercase tracking-wide" id="cal-title">...</h2>
                    <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-full"><i data-lucide="chevron-right"></i></button>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="calendar-grid bg-slate-50 border-b text-slate-500 font-bold text-xs text-center">
                    <div class="py-3 text-red-500">CN</div><div class="py-3">T2</div><div class="py-3">T3</div><div class="py-3">T4</div><div class="py-3">T5</div><div class="py-3">T6</div><div class="py-3">T7</div>
                </div>
                <div id="calendar-body" class="calendar-grid"></div>
            </div>
        </div>

        <div id="view-builder" class="view-section hidden space-y-4">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2"><i data-lucide="pencil-ruler" class="text-blue-600"></i> Soạn Giáo Án</h2>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <input id="plan-name" class="border p-2.5 rounded-lg text-sm font-bold" placeholder="Tên Giáo Án">
                    <select id="plan-student" class="border p-2.5 rounded-lg text-sm bg-white"><option value="">-- Chọn HV --</option></select>
                </div>
                <div class="border rounded-xl overflow-hidden mb-4">
                    <table class="w-full text-sm text-left"><tbody id="plan-rows" class="divide-y divide-slate-100"></tbody></table>
                    <button onclick="addPlanRow()" class="w-full py-2 bg-slate-50 text-blue-600 text-xs font-bold hover:bg-blue-50 border-t">+ Thêm bài</button>
                </div>
                <button onclick="savePlan()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">Lưu & Gửi</button>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-700 mb-4">Đã Giao</h2>
                <div class="max-h-60 overflow-y-auto"><table class="w-full text-sm"><thead class="bg-slate-50 sticky top-0"><tr><th class="p-3">Tên</th><th class="p-3">HV</th><th class="p-3 text-right">Xóa</th></tr></thead><tbody id="plan-list" class="divide-y"></tbody></table></div>
            </div>
        </div>

        <div id="view-students" class="view-section hidden space-y-4"><div class="flex justify-between"><h2 class="text-lg font-bold text-slate-700">Học Viên</h2><button onclick="toggleModal('modal-add-student')" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold flex gap-2 shadow-lg"><i data-lucide="user-plus" class="w-4 h-4"></i> Thêm</button></div><div class="bg-white rounded-xl shadow border overflow-hidden"><table class="w-full text-sm"><thead class="bg-slate-50 border-b"><tr><th class="p-4">Tên</th><th class="p-4 text-center">Gói</th><th class="p-4 text-right">Action</th></tr></thead><tbody id="student-list" class="divide-y"></tbody></table></div></div>
        
        <div id="view-exercise" class="view-section hidden grid grid-cols-3 gap-6"><div class="col-span-1 bg-white p-6 rounded-xl shadow border h-fit"><h2 class="font-bold mb-4">Thêm Bài</h2><form id="form-ex" class="space-y-3"><input id="ex-name" class="w-full border p-2 rounded" placeholder="Tên" required><select id="ex-group" class="w-full border p-2 rounded"><option>Ngực</option><option>Lưng</option><option>Chân</option></select><input id="ex-video" class="w-full border p-2 rounded" placeholder="Youtube"><button class="w-full bg-blue-600 text-white font-bold py-2 rounded">Lưu</button></form></div><div class="col-span-2 bg-white p-6 rounded-xl shadow border"><h2 class="font-bold mb-4">Kho Bài</h2><div class="max-h-96 overflow-y-auto"><table class="w-full text-sm"><tbody id="ex-list"></tbody></table></div></div></div>
        
        <div id="view-food" class="view-section hidden grid grid-cols-3 gap-6"><div class="col-span-1 bg-white p-6 rounded-xl shadow border h-fit"><h2 class="font-bold mb-4">Thêm Món</h2><form id="form-fd" class="space-y-3"><input id="fd-name" class="w-full border p-2 rounded" placeholder="Tên" required><div class="grid grid-cols-2 gap-2"><input id="fd-cal" type="number" class="border p-2 rounded" placeholder="Calo"><input id="fd-unit" class="border p-2 rounded" value="100g"></div><button class="w-full bg-green-600 text-white font-bold py-2 rounded">Lưu</button></form></div><div class="col-span-2 bg-white p-6 rounded-xl shadow border"><h2 class="font-bold mb-4">Kho Món</h2><div class="max-h-96 overflow-y-auto"><table class="w-full text-sm"><tbody id="fd-list"></tbody></table></div></div></div>

    </div>

    <div id="modal-day-detail" class="modal opacity-0 pointer-events-none fixed inset-0 flex items-center justify-center z-50">
        <div class="absolute inset-0 bg-slate-900 opacity-60 backdrop-blur-sm" onclick="toggleModal('modal-day-detail')"></div>
        <div class="bg-white w-11/12 max-w-md rounded-2xl shadow-2xl z-50 flex flex-col max-h-[85vh] animate-in zoom-in-95 duration-200">
            <div class="p-4 border-b bg-slate-50 flex justify-between items-center rounded-t-2xl">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2"><i data-lucide="calendar" class="text-blue-600 w-5 h-5"></i> <span id="detail-date-title">...</span></h3>
                <button onclick="toggleModal('modal-day-detail')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 bg-slate-50/50" id="day-session-list"></div>
            <div class="p-4 border-t bg-white rounded-b-2xl shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                <button onclick="openBookFromDetail()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl flex justify-center items-center gap-2 shadow-lg transition-transform active:scale-95">
                    <i data-lucide="plus-circle" class="w-5 h-5"></i> Đặt Lịch Mới
                </button>
            </div>
        </div>
    </div>

    <div id="modal-edit-session" class="modal opacity-0 pointer-events-none fixed inset-0 flex items-center justify-center z-50">
        <div class="absolute inset-0 bg-slate-900 opacity-50"></div>
        <div class="bg-white w-11/12 max-w-sm rounded-2xl shadow-2xl z-50 p-6">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Dời Lịch Tập</h3>
            <input type="hidden" id="edit-id">
            <div class="space-y-3">
                <div><label class="text-xs font-bold text-slate-500 block mb-1">Ngày mới</label><input id="edit-date" type="date" class="w-full border p-2 rounded-lg font-bold"></div>
                <div><label class="text-xs font-bold text-slate-500 block mb-1">Giờ mới</label><input id="edit-time" type="time" class="w-full border p-2 rounded-lg font-bold"></div>
                <div class="flex gap-2 pt-2">
                    <button onclick="toggleModal('modal-edit-session')" class="flex-1 bg-slate-100 text-slate-600 font-bold py-2 rounded-lg">Hủy</button>
                    <button onclick="submitEditSession()" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg">Lưu</button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="modal-book" class="modal opacity-0 pointer-events-none fixed inset-0 flex items-center justify-center z-50"><div class="absolute inset-0 bg-slate-900 opacity-50"></div><div class="bg-white w-11/12 max-w-sm rounded-2xl shadow-2xl z-50 p-6 relative"><button onclick="toggleModal('modal-book')" class="absolute top-4 right-4 text-slate-400"><i data-lucide="x"></i></button><h3 class="text-lg font-bold mb-4">Đặt Lịch</h3><form id="form-book" class="space-y-3"><input id="bk-date" type="date" class="w-full border p-2 rounded bg-slate-50 font-bold" readonly><input id="bk-time" type="time" class="w-full border p-2 rounded" required><select id="bk-student" class="w-full border p-2 rounded" required></select><button class="w-full bg-blue-600 text-white font-bold py-2 rounded-xl">Lưu</button></form></div></div>
    
    <div id="modal-add-student" class="modal opacity-0 pointer-events-none fixed inset-0 flex items-center justify-center z-50"><div class="absolute inset-0 bg-slate-900 opacity-50"></div><div class="bg-white w-11/12 max-w-md rounded-2xl shadow-2xl z-50 p-6 relative"><button onclick="toggleModal('modal-add-student')" class="absolute top-4 right-4 text-slate-400"><i data-lucide="x"></i></button><h3 class="text-lg font-bold mb-4">Thêm Học Viên</h3><form id="form-reg" class="space-y-3"><input id="reg-name" class="w-full border p-3 rounded" placeholder="Tên" required><input id="reg-email" class="w-full border p-3 rounded" placeholder="Email" required><input id="reg-phone" class="w-full border p-3 rounded" placeholder="SĐT" required><button class="w-full bg-blue-600 text-white font-bold py-3 rounded">Tạo</button></form></div></div>

    <datalist id="dl-exercises"></datalist>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyDv_79EPDM3BzzbYOXevQrocyh60o-qzU63U3N5p7gIuSD2tWhEVKnO1lR7qAJ6qsS/exec"; 
        lucide.createIcons();
        const USER=JSON.parse(localStorage.getItem('pt_user')); if(!USER||USER.role!=='PT') window.location.href='login.html';
        document.getElementById('ptName').innerText = USER.name;

        let STUDENTS=[], STUDENTS_MAP={}, SCHEDULE=[], EXERCISES=[], FOODS=[], PLANS=[], DATE=new Date(), SEL_DATE="";

        async function callAPI(a,d={}) { try{const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action:a,data:d})});return await r.json();}catch(e){alert(e);return{success:false};} }
        async function init() { await Promise.all([loadSt(), loadSch(), loadEx(), loadFd(), loadPl()]); addPlanRow(); }

        // --- CALENDAR ---
        async function loadSch() { const r=await callAPI('get_schedule'); if(r.success) { SCHEDULE=r.data; renderCal(); } }
        function renderCal() {
            const y=DATE.getFullYear(), m=DATE.getMonth(), fd=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate();
            document.getElementById('cal-title').innerText=`Tháng ${m+1}/${y}`;
            const b=document.getElementById('calendar-body'); b.innerHTML='';
            for(let i=0;i<fd;i++) b.innerHTML+=`<div class="calendar-cell bg-slate-50"></div>`;
            for(let d=1;d<=dim;d++) {
                const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const evs=SCHEDULE.filter(e=>e.date===ds);
                const html=evs.map(e=>`<div class="event-tag ${e.status==='Completed'?'evt-completed':e.status==='Cancelled'?'evt-cancelled':'evt-upcoming'}"><span>${e.time}</span> ${STUDENTS_MAP[e.userId]?.split(' ').pop()||'?'}</div>`).join('');
                b.innerHTML+=`<div class="calendar-cell group" onclick="openDetail('${ds}')"><div class="flex justify-between"><span class="font-bold text-slate-400 text-xs group-hover:text-blue-600">${d}</span>${evs.length?`<span class="text-[10px] bg-slate-100 px-1 rounded text-slate-500 font-bold">${evs.length}</span>`:''}</div><div class="space-y-1 mt-1 overflow-y-auto max-h-[80px] no-scrollbar">${html}</div></div>`;
            }
        }
        
        // CHI TIẾT NGÀY (Update: Có nút Check-in & Edit)
        function openDetail(ds) {
            SEL_DATE=ds; document.getElementById('detail-date-title').innerText=ds.split('-').reverse().join('/');
            const evs=SCHEDULE.filter(e=>e.date===ds).sort((a,b)=>a.time.localeCompare(b.time));
            const list=document.getElementById('day-session-list');
            
            if(evs.length===0) list.innerHTML='<div class="text-center text-slate-400 py-8">Trống lịch.</div>';
            else {
                list.innerHTML = evs.map(e => {
                    const stName = STUDENTS_MAP[e.userId] || "Unknown";
                    // Tìm info học viên để hiện số buổi còn lại
                    const st = STUDENTS.find(s=>s.id===e.userId);
                    const sessionLeft = st ? st.sessionLeft : 0;

                    let statusHTML = `<span class="text-blue-600 bg-blue-50 px-2 py-0.5 rounded text-xs font-bold">Sắp tới</span>`;
                    let actions = `
                        <button onclick="checkIn('${e.id}', '${e.userId}')" class="p-2 bg-green-50 text-green-600 hover:bg-green-100 rounded-lg" title="Check-in"><i data-lucide="check-circle-2" class="w-4 h-4"></i></button>
                        <button onclick="openEdit('${e.id}','${e.date}','${e.time}')" class="p-2 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-lg" title="Dời lịch"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                        <button onclick="cancel('${e.id}')" class="p-2 bg-red-50 text-red-500 hover:bg-red-100 rounded-lg" title="Hủy"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    `;

                    if(e.status==='Completed') { statusHTML=`<span class="text-slate-500 bg-slate-100 px-2 py-0.5 rounded text-xs line-through">Đã xong</span>`; actions=''; }
                    if(e.status==='Cancelled') { statusHTML=`<span class="text-red-500 bg-red-50 px-2 py-0.5 rounded text-xs line-through">Đã hủy</span>`; actions=''; }

                    return `
                    <div class="bg-white p-3 rounded-xl border shadow-sm mb-3 flex justify-between items-center">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="font-black text-lg text-slate-700">${e.time}</span>
                                ${statusHTML}
                            </div>
                            <div class="font-bold text-slate-800 text-sm">${stName}</div>
                            <div class="text-xs text-slate-400">Còn: <b class="text-blue-600">${sessionLeft}</b> buổi</div>
                        </div>
                        <div class="flex gap-1">${actions}</div>
                    </div>`;
                }).join('');
            }
            lucide.createIcons();
            toggleModal('modal-day-detail');
        }

        // HÀM XỬ LÝ LỊCH
        async function checkIn(bkId, userId) {
            if(!confirm("Xác nhận học viên đã tập xong (Trừ 1 buổi)?")) return;
            // 1. Trừ buổi
            await callAPI('deduct_session', {userId});
            // 2. Update lịch thành Completed
            await callAPI('update_schedule', {bookingId: bkId, status: 'Completed'});
            alert("✅ Đã check-in!");
            await Promise.all([loadSch(), loadSt()]); // Reload data
            openDetail(SEL_DATE); // Refresh modal
        }

        function openEdit(id, date, time) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-date').value = date;
            document.getElementById('edit-time').value = time;
            toggleModal('modal-edit-session');
        }

        async function submitEditSession() {
            const id = document.getElementById('edit-id').value;
            const date = document.getElementById('edit-date').value;
            const time = document.getElementById('edit-time').value;
            await callAPI('update_schedule', {bookingId: id, date, time});
            alert("✅ Đã dời lịch!");
            toggleModal('modal-edit-session');
            loadSch();
            openDetail(SEL_DATE);
        }
        
        async function cancel(id) { if(confirm("Hủy lịch?")) { await callAPI('cancel_session',{bookingId:id}); loadSch(); openDetail(SEL_DATE); } }
        function openBookFromDetail() { toggleModal('modal-day-detail'); document.getElementById('bk-date').value=SEL_DATE; document.getElementById('bk-time').value="18:00"; toggleModal('modal-book'); }
        document.getElementById('form-book').addEventListener('submit', async(e)=>{ e.preventDefault(); await callAPI('book_session',{userId:document.getElementById('bk-student').value, date:document.getElementById('bk-date').value, time:document.getElementById('bk-time').value}); alert("OK"); toggleModal('modal-book'); loadSch(); });
        function changeMonth(s) { CURRENT_DATE.setMonth(CURRENT_DATE.getMonth()+s); renderCal(); }

        // --- DATA LOADERS (Rút gọn) ---
        async function loadSt() { const r=await callAPI('get_all_students'); if(r.success) { STUDENTS=r.data; STUDENTS_MAP={}; STUDENTS.forEach(s=>STUDENTS_MAP[s.id]=s.name); const o='<option value="">-- Chọn --</option>'+STUDENTS.map(s=>`<option value="${s.id}">${s.name}</option>`).join(''); document.getElementById('plan-student').innerHTML=o; document.getElementById('bk-student').innerHTML=o; document.getElementById('student-list').innerHTML=STUDENTS.map(s=>`<tr class="hover:bg-slate-50 border-b"><td class="p-4"><b>${s.name}</b><br><span class="text-xs text-slate-400">${s.email}</span></td><td class="p-4 text-center font-bold text-blue-600">${s.sessionLeft}</td><td class="p-4 text-right"><button onclick="topUp('${s.id}','${s.name}')" class="bg-blue-50 text-blue-600 px-2 py-1 rounded text-xs font-bold border">Nạp</button></td></tr>`).join(''); } }
        async function loadEx() { const r=await callAPI('get_exercise_lib'); if(r.success) { EXERCISES=r.data; document.getElementById('dl-exercises').innerHTML=EXERCISES.map(e=>`<option value="${e.name}">`).join(''); document.getElementById('ex-list').innerHTML=EXERCISES.map(e=>`<tr class="border-b hover:bg-slate-50"><td class="p-3">${e.name}</td><td class="p-3 text-slate-500">${e.group}</td><td class="p-3 text-right"><button onclick="delItem('exercise','${e.id}')" class="text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td></tr>`).join(''); lucide.createIcons(); } }
        async function loadFd() { const r=await callAPI('get_all_foods'); if(r.success) { FOODS=r.data; document.getElementById('fd-list').innerHTML=FOODS.map(f=>`<tr class="border-b hover:bg-slate-50"><td class="p-3">${f.name}</td><td class="p-3">${f.cal}</td><td class="p-3 text-right"><button onclick="delItem('food','${f.id}')" class="text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td></tr>`).join(''); lucide.createIcons(); } }
        async function loadPl() { const r=await callAPI('get_all_plans'); if(r.success) { PLANS=r.data; document.getElementById('plan-list').innerHTML=PLANS.map(p=>`<tr class="border-b hover:bg-slate-50"><td class="p-3 font-bold text-blue-600">${p.name}</td><td class="p-3">${STUDENTS_MAP[p.userId]||p.userId}</td><td class="p-3 text-right"><button onclick="delItem('plan','${p.id}')" class="text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td></tr>`).join(''); lucide.createIcons(); } }
        async function initDashboard() { const r=await callAPI('admin_get_dashboard'); if(r.success) { document.getElementById('stat-total').innerText=r.data.totalStudent; document.getElementById('stat-active').innerText=r.data.activeStudent; document.getElementById('stat-today').innerText=r.data.todaySessions; } }

        // --- ACTIONS ---
        function addPlanRow() { document.getElementById('plan-rows').insertAdjacentHTML('beforeend', `<tr><td class="p-2"><select class="w-full border p-1 rounded text-sm"><option>Thứ 2</option><option>Thứ 3</option><option>Thứ 4</option><option>Thứ 5</option><option>Thứ 6</option><option>Thứ 7</option></select></td><td class="p-2"><input list="dl-exercises" class="w-full border p-1 rounded text-sm font-bold" placeholder="Tên bài..."></td><td class="p-2"><input type="number" value="3" class="w-full border p-1 rounded text-sm text-center"></td><td class="p-2"><input type="number" value="10" class="w-full border p-1 rounded text-sm text-center"></td><td class="p-2"><input class="w-full border p-1 rounded text-sm"></td><td class="p-2"><button onclick="this.closest('tr').remove()" class="text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td></tr>`); lucide.createIcons(); }
        async function savePlan() { const name=document.getElementById('plan-name').value, uId=document.getElementById('plan-student').value; if(!name||!uId) return alert("Thiếu thông tin!"); const details=Array.from(document.querySelectorAll('#plan-rows tr')).map(r=>{const i=r.querySelectorAll('input,select');return{day:i[0].value,exercise:i[1].value,sets:i[2].value,reps:i[3].value,note:i[4].value}}).filter(d=>d.exercise); await callAPI('save_workout_plan',{planName:name,targetUser:uId,details}); alert("OK"); loadPl(); }
        async function delItem(t,id) { if(confirm("Xóa?")) { await callAPI(`admin_delete_${t}`,{id}); if(t=='exercise')loadEx(); if(t=='food')loadFd(); if(t=='plan')loadPl(); } }
        async function topUp(id,n) { const a=prompt(`Nạp buổi cho ${n}?`,"10"); if(a) { await callAPI('admin_update_student',{studentId:id,addSession:a}); loadSt(); } }
        document.getElementById('form-ex').addEventListener('submit', async(e)=>{e.preventDefault(); await callAPI('admin_add_exercise',{name:document.getElementById('ex-name').value, group:document.getElementById('ex-group').value, video:document.getElementById('ex-video').value}); alert("OK"); loadEx(); });
        document.getElementById('form-fd').addEventListener('submit', async(e)=>{e.preventDefault(); await callAPI('admin_add_food',{name:document.getElementById('fd-name').value, cal:document.getElementById('fd-cal').value, unit:document.getElementById('fd-unit').value}); alert("OK"); loadFd(); });
        document.getElementById('form-reg').addEventListener('submit', async(e)=>{e.preventDefault(); await callAPI('register',{name:document.getElementById('reg-name').value, email:document.getElementById('reg-email').value, phone:document.getElementById('reg-phone').value}); alert("OK"); toggleModal('modal-add-student'); loadSt(); });

        function switchTab(n,b) { document.querySelectorAll('.view-section').forEach(e=>e.classList.add('hidden')); document.getElementById(`view-${n}`).classList.remove('hidden'); document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active')); b.classList.add('active'); }
        function toggleModal(id) { const m=document.getElementById(id); m.classList.toggle('opacity-0'); m.classList.toggle('pointer-events-none'); document.body.classList.toggle('modal-active'); }
        function logout() { localStorage.removeItem('pt_user'); window.location.href='login.html'; }
        
        init();
    </script>
</body>
</html>
