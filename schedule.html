<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Hẹn - PT Manager</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Timeline Connector */
        .timeline-item { position: relative; padding-left: 24px; padding-bottom: 24px; border-left: 2px solid #e2e8f0; }
        .timeline-item:last-child { border-left: 2px solid transparent; }
        .timeline-dot { 
            position: absolute; left: -7px; top: 0; 
            width: 12px; height: 12px; border-radius: 50%; 
            background: white; border: 2px solid #cbd5e1;
        }
        .timeline-item.upcoming .timeline-dot { border-color: #2563eb; background: #eff6ff; }
        .timeline-item.upcoming { border-left-color: #bfdbfe; }
        
        /* Hero Card Animation */
        @keyframes pulse-soft { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.2); } 70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
        .hero-card { animation: pulse-soft 2s infinite; }
    </style>
</head>
<body class="bg-slate-50 pb-24 font-sans text-slate-800">

    <div class="bg-white p-4 sticky top-0 z-20 shadow-sm border-b border-slate-100 flex justify-between items-center">
        <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
            <i data-lucide="calendar-clock" class="text-blue-600 w-6 h-6"></i> Lịch Của Tôi
        </h1>
        <div class="text-xs text-slate-500 font-medium bg-slate-100 px-3 py-1 rounded-full" id="currentDate">...</div>
    </div>

    <div class="max-w-md mx-auto px-4 mt-6 space-y-6">

        <div id="next-session-container">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center py-10">
                <div class="animate-pulse flex flex-col items-center">
                    <div class="h-12 w-12 bg-slate-200 rounded-full mb-3"></div>
                    <div class="h-4 w-32 bg-slate-200 rounded mb-2"></div>
                    <div class="h-3 w-20 bg-slate-200 rounded"></div>
                </div>
            </div>
        </div>

        <div class="flex p-1 bg-slate-200 rounded-xl">
            <button onclick="switchTab('upcoming')" id="tab-upcoming" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white text-blue-600 shadow-sm transition-all">Sắp tới</button>
            <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all">Lịch sử</button>
        </div>

        <div id="schedule-list" class="pl-2 pt-2">
            </div>

    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 safe-area-pb">
        <div class="max-w-md mx-auto flex justify-around items-center h-16">
            <a href="index.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600 transition-colors">
                <i data-lucide="home" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Home</span>
            </a>
            <a href="workout.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600 transition-colors">
                <i data-lucide="dumbbell" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Tập</span>
            </a>
            <a href="nutrition.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600 transition-colors">
                <i data-lucide="utensils" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Ăn</span>
            </a>
            <a href="schedule.html" class="flex flex-col items-center justify-center w-full h-full text-blue-600 transition-colors">
                <i data-lucide="calendar" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">Lịch</span>
            </a>
            <button onclick="logout()" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-red-500 transition-colors">
                <i data-lucide="log-out" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Thoát</span>
            </button>
        </div>
    </div>

    <script>
        // 1. CẤU HÌNH & AUTH
        const API_URL = "https://script.google.com/macros/s/AKfycbyDv_79EPDM3BzzbYOXevQrocyh60o-qzU63U3N5p7gIuSD2tWhEVKnO1lR7qAJ6qsS/exec"; 
        lucide.createIcons();
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('vi-VN');
        
        const userJson = localStorage.getItem('pt_user');
        if (!userJson) window.location.href = 'login.html';
        const USER = JSON.parse(userJson);

        let ALL_EVENTS = [];
        let CURRENT_TAB = 'upcoming';

        // 2. CORE API
        async function callAPI(action, data={}) {
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({action, data}) });
                return await res.json();
            } catch(e) { return { success: false }; }
        }

        // 3. LOGIC CHÍNH
        // ...
        const CACHE_KEY_SCH = `pt_schedule_${user.id}`;

        async function loadSchedule() {
             // 1. Cache
            const cached = localStorage.getItem(CACHE_KEY_SCH);
            if (cached) {
                ALL_EVENTS = JSON.parse(cached);
                renderHeroCard();
                renderList();
            }

            // 2. API
            const res = await callAPI('get_schedule');
            if (res.success) {
                const myEvents = res.data.filter(e => e.userId === USER.id);
                ALL_EVENTS = myEvents.sort((a,b) => new Date(a.date+'T'+a.time) - new Date(b.date+'T'+b.time));
                
                localStorage.setItem(CACHE_KEY_SCH, JSON.stringify(ALL_EVENTS));
                renderHeroCard();
                renderList();
            }
        }

        // Render thẻ "Buổi tập tiếp theo"
        function renderHeroCard() {
            const container = document.getElementById('next-session-container');
            const now = new Date();
            
            // Tìm sự kiện sắp tới gần nhất (Upcoming và chưa qua giờ)
            const nextEvent = ALL_EVENTS.find(e => {
                const eventTime = new Date(e.date + 'T' + e.time);
                return e.status === 'Upcoming' && eventTime > now;
            });

            if (nextEvent) {
                const dateObj = new Date(nextEvent.date);
                const displayDate = dateObj.toLocaleDateString('vi-VN', {weekday: 'long', day: '2-digit', month: '2-digit'});
                
                // Fix giờ hiển thị
                const showTime = nextEvent.time.length > 8 ? nextEvent.time.substring(11, 16) : nextEvent.time;

                container.innerHTML = `
                <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-6 shadow-xl shadow-blue-200 text-white relative overflow-hidden hero-card">
                    <i data-lucide="alarm-clock" class="absolute right-[-10px] bottom-[-10px] w-32 h-32 text-white opacity-10 rotate-12"></i>
                    
                    <p class="text-blue-100 text-xs font-bold uppercase tracking-wider mb-2">Buổi tập tiếp theo</p>
                    
                    <div class="flex items-center gap-4 mb-4">
                        <div class="bg-white/20 p-3 rounded-xl backdrop-blur-sm">
                            <span class="block text-2xl font-black leading-none">${showTime}</span>
                        </div>
                        <div>
                            <h2 class="text-xl font-bold capitalize">${displayDate}</h2>
                            <p class="text-sm text-blue-100 flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i> Phòng tập</p>
                        </div>
                    </div>
                    
                    <div class="bg-white/10 rounded-lg p-3 text-xs flex gap-2 items-center backdrop-blur-sm border border-white/10">
                        <i data-lucide="info" class="w-4 h-4 text-blue-200"></i>
                        <span>Đừng quên mang khăn và nước uống nhé!</span>
                    </div>
                </div>`;
            } else {
                container.innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center">
                    <div class="bg-slate-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i data-lucide="calendar-check" class="w-8 h-8 text-slate-400"></i>
                    </div>
                    <h3 class="font-bold text-slate-700">Không có lịch sắp tới</h3>
                    <p class="text-xs text-slate-400 mt-1">Hãy liên hệ PT để đặt lịch tập mới nhé.</p>
                </div>`;
            }
            lucide.createIcons();
        }

        // Render Danh sách Timeline
        function renderList() {
            const container = document.getElementById('schedule-list');
            container.innerHTML = '';

            const now = new Date();
            let filteredEvents = [];

            if (CURRENT_TAB === 'upcoming') {
                // Lấy lịch sắp tới (bao gồm cả hôm nay)
                filteredEvents = ALL_EVENTS.filter(e => {
                    const t = new Date(e.date + 'T' + e.time);
                    return e.status === 'Upcoming' && t >= now.setHours(0,0,0,0);
                });
            } else {
                // Lấy lịch sử (Đã xong, Đã hủy, hoặc Quá khứ)
                filteredEvents = ALL_EVENTS.filter(e => {
                    const t = new Date(e.date + 'T' + e.time);
                    return e.status !== 'Upcoming' || t < now;
                }).reverse(); // Mới nhất lên đầu
            }

            if (filteredEvents.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-400 py-8 text-sm">Danh sách trống.</div>';
                return;
            }

            // Gom nhóm theo Tháng
            let currentMonth = '';
            
            filteredEvents.forEach(e => {
                const dateObj = new Date(e.date);
                const monthStr = `Tháng ${dateObj.getMonth() + 1}, ${dateObj.getFullYear()}`;
                
                // Tiêu đề tháng
                if (monthStr !== currentMonth) {
                    currentMonth = monthStr;
                    container.innerHTML += `<div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 mt-2 pl-2">${currentMonth}</div>`;
                }

                const day = dateObj.getDate();
                const weekday = dateObj.toLocaleDateString('vi-VN', {weekday: 'short'});
                const showTime = e.time.length > 8 ? e.time.substring(11, 16) : e.time;

                // Style trạng thái
                let statusClass = 'upcoming';
                let statusText = 'Sắp tới';
                let icon = 'clock';
                
                if (e.status === 'Completed') { statusClass = ''; statusText = 'Đã tập'; icon = 'check-circle-2'; }
                if (e.status === 'Cancelled') { statusClass = ''; statusText = 'Đã hủy'; icon = 'x-circle'; }
                // Nếu quá khứ mà vẫn Upcoming -> coi như Missed/Chưa checkin
                if (e.status === 'Upcoming' && new Date(e.date+'T'+e.time) < new Date()) {
                    statusText = 'Chưa check-in'; icon = 'alert-circle'; 
                }

                const html = `
                <div class="timeline-item ${statusClass} pb-6">
                    <div class="timeline-dot"></div>
                    <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="text-center min-w-[40px]">
                                <div class="text-[10px] font-bold text-slate-400 uppercase">${weekday}</div>
                                <div class="text-xl font-black text-slate-700 leading-none">${day}</div>
                            </div>
                            <div class="w-px h-8 bg-slate-100"></div>
                            <div>
                                <div class="font-bold text-lg text-blue-600 font-mono">${showTime}</div>
                                <div class="text-xs text-slate-500 flex items-center gap-1">
                                    <i data-lucide="${icon}" class="w-3 h-3"></i> ${statusText}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
                
                container.insertAdjacentHTML('beforeend', html);
            });
            lucide.createIcons();
        }

        // Chuyển Tab
        function switchTab(tab) {
            CURRENT_TAB = tab;
            
            // Update UI Button
            const btnUp = document.getElementById('tab-upcoming');
            const btnHis = document.getElementById('tab-history');
            
            if (tab === 'upcoming') {
                btnUp.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-blue-600 shadow-sm transition-all";
                btnHis.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all";
            } else {
                btnUp.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all";
                btnHis.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-slate-800 shadow-sm transition-all";
            }
            
            renderList();
        }

        function logout() {
            if(confirm('Đăng xuất?')) {
                localStorage.removeItem('pt_user');
                window.location.href='login.html';
            }
        }

        loadSchedule();
    </script>
</body>
</html>
