<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinh Dưỡng - PT Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="layout.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-tab { background-color: #16a34a; color: white; box-shadow: 0 4px 6px -1px rgba(22, 163, 74, 0.3); }
        .macro-card { transition: transform 0.1s; } .macro-card:active { transform: scale(0.98); }
        .meal-group-title { position: sticky; top: 0; background: rgba(248,250,252, 0.95); backdrop-filter: blur(4px); z-index: 5; padding: 12px 0; border-bottom: 1px dashed #e2e8f0; }
        @keyframes fill-bar { from { width: 0%; } }
    </style>
</head>
<body class="bg-slate-50 pb-28 font-sans text-slate-800 select-none">

    <div id="toast-container"></div>

    <div class="bg-white p-5 sticky top-0 z-20 shadow-sm flex justify-between items-center border-b border-slate-100">
        <div>
            <h1 class="text-2xl font-black text-slate-900 flex items-center gap-2 tracking-tight">
                <i data-lucide="leaf" class="text-green-600 w-7 h-7"></i> Dinh Dưỡng
            </h1>
            <p class="text-xs text-slate-400 font-medium mt-1" id="currentDate">...</p>
        </div>
        <button onclick="window.location.reload()" class="p-2.5 bg-slate-50 rounded-full text-slate-400 hover:text-green-600 hover:bg-green-50 transition-colors"><i data-lucide="rotate-cw" class="w-5 h-5"></i></button>
    </div>

    <div class="max-w-md mx-auto px-5 mt-6 space-y-8">

        <div class="bg-white p-6 rounded-3xl shadow-lg shadow-slate-200/60 border border-slate-100">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Năng lượng đã nạp</p>
                    <div class="flex items-baseline gap-1">
                        <span class="text-5xl font-black text-slate-800 tracking-tighter" id="val-cal">0</span>
                        <span class="text-sm text-slate-400 font-semibold">/ 2000</span>
                    </div>
                </div>
                <div class="h-12 w-12 bg-green-100 rounded-2xl flex items-center justify-center text-green-600 shadow-sm">
                    <i data-lucide="flame" class="w-6 h-6 fill-current"></i>
                </div>
            </div>
            
            <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden mb-6">
                <div id="bar-cal" class="h-full bg-gradient-to-r from-green-400 to-green-600 rounded-full transition-all duration-1000 ease-out shadow-[0_0_10px_rgba(34,197,94,0.5)]" style="width: 0%"></div>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div class="macro-card bg-red-50/50 p-3 rounded-2xl border border-red-100 text-center">
                    <p class="text-[9px] text-red-400 font-bold uppercase tracking-wider mb-1">Protein</p>
                    <p class="text-xl font-black text-red-600"><span id="val-pro">0</span><span class="text-xs font-medium ml-0.5 opacity-70">g</span></p>
                </div>
                <div class="macro-card bg-orange-50/50 p-3 rounded-2xl border border-orange-100 text-center">
                    <p class="text-[9px] text-orange-400 font-bold uppercase tracking-wider mb-1">Carbs</p>
                    <p class="text-xl font-black text-orange-600"><span id="val-carb">0</span><span class="text-xs font-medium ml-0.5 opacity-70">g</span></p>
                </div>
                <div class="macro-card bg-yellow-50/50 p-3 rounded-2xl border border-yellow-100 text-center">
                    <p class="text-[9px] text-yellow-600 font-bold uppercase tracking-wider mb-1">Fat</p>
                    <p class="text-xl font-black text-yellow-700"><span id="val-fat">0</span><span class="text-xs font-medium ml-0.5 opacity-70">g</span></p>
                </div>
            </div>
        </div>

        <div class="space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="font-bold text-slate-800 text-base flex items-center gap-2"><i data-lucide="plus-circle" class="w-4 h-4 text-green-600"></i> Thêm Bữa Ăn</h2>
                <div class="flex bg-slate-100 p-1 rounded-lg">
                    <button onclick="switchInputMode('search')" id="tab-search" class="px-4 py-1.5 text-[11px] font-bold rounded-md active-tab transition-all">Tìm Món</button>
                    <button onclick="switchInputMode('manual')" id="tab-manual" class="px-4 py-1.5 text-[11px] font-bold rounded-md text-slate-400 hover:text-slate-600 transition-all">Nhập Nhanh</button>
                </div>
            </div>

            <div id="mode-search" class="space-y-4 animate-in fade-in zoom-in-95 duration-300">
                <div class="relative group">
                    <input id="food-search" type="text" placeholder="Bạn ăn gì? (vd: cơm, gà...)" class="w-full bg-white border-2 border-slate-100 p-3.5 pl-12 rounded-2xl outline-none focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition-all font-medium placeholder:text-slate-300 text-slate-700" onkeyup="filterFoods()">
                    <i data-lucide="search" class="absolute left-4 top-4 text-slate-400 w-5 h-5 group-focus-within:text-green-500 transition-colors"></i>
                </div>
                
                <div id="food-list" class="space-y-2.5 max-h-80 overflow-y-auto no-scrollbar pr-1">
                    <div class="text-center py-8 text-slate-400 text-xs">
                        <i data-lucide="database" class="w-6 h-6 mx-auto mb-2 opacity-50"></i>
                        Đang tải kho dữ liệu...
                    </div>
                </div>
            </div>

            <div id="mode-manual" class="hidden bg-white p-6 rounded-3xl border border-slate-100 shadow-lg shadow-slate-100 space-y-5 relative animate-in fade-in zoom-in-95 duration-300">
                <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase mb-2 block">Tên món ăn</label>
                    <input id="man-name" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-sm font-bold outline-none focus:border-green-500 focus:bg-white transition-all" placeholder="Vd: Bún bò, Tiệc cưới...">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase mb-2 block">Tổng Calories (ước lượng)</label>
                    <div class="relative">
                        <input id="man-cal" type="number" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-xl font-black text-green-600 outline-none focus:border-green-500 focus:bg-white transition-all placeholder:text-slate-300" placeholder="0">
                        <span class="absolute right-4 top-4 text-xs text-slate-400 font-bold">kcal</span>
                    </div>
                </div>
                
                <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase mb-2 block">Thời điểm</label>
                    <div class="grid grid-cols-4 gap-2" id="manual-meal-selector">
                        </div>
                </div>

                <button onclick="addManualFood()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-xl shadow-green-200 transition-transform active:scale-95 flex justify-center items-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i> Lưu Vào Nhật Ký
                </button>
            </div>
        </div>

        <div class="pt-4">
            <div class="flex justify-between items-end mb-4">
                <h2 class="font-bold text-slate-800 text-base flex items-center gap-2"><i data-lucide="book-open" class="w-4 h-4 text-green-600"></i> Nhật Ký Hôm Nay</h2>
                <span class="text-[10px] font-bold bg-slate-100 text-slate-500 px-2.5 py-1 rounded-full" id="log-count">0 món</span>
            </div>
            <div id="daily-log" class="space-y-1">
                </div>
        </div>
    </div>

    <div id="modal-amount" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 animate-in fade-in duration-200 px-4">
        <div class="bg-white w-full max-w-sm rounded-[2rem] shadow-2xl p-6 transform transition-all scale-100">
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-green-50 text-green-600 rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm">
                    <i data-lucide="scale" class="w-6 h-6"></i>
                </div>
                <h3 class="text-xl font-black text-slate-800 mb-1 leading-tight line-clamp-2" id="modal-food-name">...</h3>
                <p class="text-xs font-medium text-slate-400 bg-slate-50 inline-block px-3 py-1 rounded-full mt-1">100g = <span id="modal-food-cal" class="text-slate-600 font-bold">...</span> kcal</p>
            </div>
            
            <div class="mb-6">
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 text-center">Bạn ăn vào lúc nào?</label>
                <div class="grid grid-cols-4 gap-2" id="meal-selector">
                    </div>
            </div>

            <div class="mb-8 bg-slate-50 p-1 rounded-2xl border border-slate-100">
                <div class="flex items-center justify-between bg-white rounded-xl p-1 shadow-sm">
                    <button onclick="adjAmount(-50)" class="w-12 h-12 rounded-xl bg-slate-50 text-slate-400 hover:bg-red-50 hover:text-red-500 font-bold text-xl transition-colors">-</button>
                    <div class="flex-1 text-center">
                        <input id="input-amount" type="number" value="100" class="w-full text-center font-black text-green-600 text-3xl outline-none">
                        <span class="text-[10px] text-slate-400 font-bold uppercase block -mt-1">Gram</span>
                    </div>
                    <button onclick="adjAmount(50)" class="w-12 h-12 rounded-xl bg-slate-50 text-slate-400 hover:bg-green-50 hover:text-green-600 font-bold text-xl transition-colors">+</button>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <button onclick="closeModal()" class="py-3.5 rounded-xl font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 transition-colors">Hủy bỏ</button>
                <button onclick="confirmAddFood()" class="py-3.5 rounded-xl font-bold text-white bg-green-600 hover:bg-green-700 shadow-lg shadow-green-200 transition-transform active:scale-95">Thêm Vào</button>
            </div>
        </div>
    </div>

    <script>
        // 1. INIT
        lucide.createIcons();
        document.getElementById('currentDate').innerText = `Hôm nay, ${new Date().toLocaleDateString('vi-VN')}`;
        
        // Auth & Cache
        requireAuth(); // Dùng hàm từ auth.js
        const CACHE_KEY = `pt_nutri_v5_${USER.id}`;
        let DATA = JSON.parse(localStorage.getItem(CACHE_KEY)) || { cal:0, pro:0, carb:0, fat:0, list:[] };
        let FOOD_DB = [];
        let SELECTED_FOOD = null, SELECTED_MEAL = 'Phụ', SELECTED_MANUAL_MEAL = 'Phụ';

        // Khởi tạo UI Meal Buttons
        const MEALS = ['Sáng', 'Trưa', 'Tối', 'Phụ'];
        
        function renderMealButtons(containerId, selectionVarName) {
            const container = document.getElementById(containerId);
            container.innerHTML = MEALS.map(m => `
                <button onclick="selectMeal('${containerId}', '${m}')" class="meal-btn-${containerId} py-2.5 rounded-xl text-xs font-bold transition-all border-2 border-transparent ${m===window[selectionVarName] ? 'bg-green-50 border-green-500 text-green-700' : 'bg-slate-50 text-slate-500 hover:bg-slate-100'}">${m}</button>
            `).join('');
        }
        renderMealButtons('meal-selector', 'SELECTED_MEAL');
        renderMealButtons('manual-meal-selector', 'SELECTED_MANUAL_MEAL');

        // Start
        init();

        async function init() {
            renderStats(); // Render cache ngay lập tức
            await Promise.all([loadFoodDB(), loadStats()]); // Tải dữ liệu mới
        }

        // 2. LOAD DATA
        async function loadFoodDB() {
            const res = await callAPI('get_all_foods');
            if(res.success) { FOOD_DB = res.data; renderFoodList(FOOD_DB); }
        }

        async function loadStats() {
            const res = await callAPI('get_daily_macros', { userId: USER.id });
            if(res.success) {
                DATA = res.data;
                localStorage.setItem(CACHE_KEY, JSON.stringify(DATA));
                renderStats();
            }
        }

        // 3. RENDER UI
        function renderStats() {
            const clean = (n) => (isNaN(n) || n>10000) ? 0 : Math.round(n);
            
            // Update Dashboard
            animateValue("val-cal", parseInt(document.getElementById("val-cal").innerText), clean(DATA.cal), 500);
            document.getElementById('val-pro').innerText = clean(DATA.pro);
            document.getElementById('val-carb').innerText = clean(DATA.carb);
            document.getElementById('val-fat').innerText = clean(DATA.fat);
            document.getElementById('bar-cal').style.width = Math.min((clean(DATA.cal)/2000)*100, 100) + '%';
            document.getElementById('log-count').innerText = `${DATA.list.length}`;
            
            // Group & Render Logs
            const groups = { 'Sáng': [], 'Trưa': [], 'Tối': [], 'Phụ': [], 'Tiệc': [] };
            DATA.list.forEach(i => {
                let type = i.type || 'Phụ';
                // Chuẩn hóa tên bữa (nếu backend trả về chuỗi lạ)
                if(type.includes('Sáng')) type='Sáng'; else if(type.includes('Trưa')) type='Trưa'; else if(type.includes('Tối')) type='Tối'; else if(type.includes('Tiệc')) type='Tiệc'; else type='Phụ';
                groups[type].push(i);
            });

            const container = document.getElementById('daily-log');
            container.innerHTML = '';
            let hasItem = false;
            
            ['Sáng', 'Trưa', 'Tối', 'Phụ', 'Tiệc'].forEach(meal => {
                if(groups[meal].length > 0) {
                    hasItem = true;
                    let total = groups[meal].reduce((s, i) => s + Number(i.cal), 0);
                    
                    let itemsHtml = groups[meal].map(item => `
                        <div class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm flex justify-between items-center mb-2 last:mb-0">
                            <div class="flex items-center gap-3">
                                <div class="w-1.5 h-8 bg-slate-100 rounded-full"></div>
                                <div><div class="font-bold text-slate-700 text-sm">${item.name}</div></div>
                            </div>
                            <div class="font-bold text-slate-800 text-sm bg-slate-50 px-2 py-1 rounded-lg">${Math.round(item.cal)}</div>
                        </div>`).join('');
                        
                    container.innerHTML += `<div class="mb-6"><div class="meal-group-title flex justify-between items-center mb-2"><h3 class="font-bold text-slate-400 text-xs uppercase tracking-wider ml-1">${meal}</h3><span class="text-[10px] font-bold text-green-600 bg-green-50 px-2 py-1 rounded-lg">${Math.round(total)} kcal</span></div>${itemsHtml}</div>`;
                }
            });

            if(!hasItem) container.innerHTML = `<div class="text-center py-12 opacity-40"><i data-lucide="coffee" class="w-12 h-12 mx-auto mb-3 text-slate-300"></i><p class="text-sm text-slate-400 font-medium">Nhật ký trống.</p></div>`;
            lucide.createIcons();
        }

        function renderFoodList(list) {
            const container = document.getElementById('food-list');
            if(list.length === 0) { container.innerHTML = '<div class="text-center text-slate-400 py-8 text-xs">Không tìm thấy món nào.</div>'; return; }
            
            container.innerHTML = list.slice(0, 50).map((f, i) => `
                <div class="food-item p-3.5 bg-white border border-slate-100 rounded-2xl flex justify-between items-center cursor-pointer hover:border-green-500 hover:shadow-sm mb-2" onclick='openModal(${i})'>
                    <div>
                        <div class="font-bold text-slate-700 text-sm">${f.name}</div>
                        <div class="text-[10px] text-slate-400 mt-1 font-bold flex gap-2">
                            <span class="text-orange-500 bg-orange-50 px-1.5 rounded">${f.cal} kcal</span>
                            <span>P:${f.pro} C:${f.carb} F:${f.fat}</span>
                        </div>
                    </div>
                    <div class="h-8 w-8 bg-green-50 rounded-full flex items-center justify-center text-green-600"><i data-lucide="plus" class="w-5 h-5"></i></div>
                </div>`).join('');
            lucide.createIcons();
        }

        // 4. ACTIONS
        function filterFoods() {
            const k = document.getElementById('food-search').value.toLowerCase();
            renderFoodList(FOOD_DB.filter(f => f.name.toLowerCase().includes(k)));
        }

        function openModal(index) {
            SELECTED_FOOD = FOOD_DB[index];
            document.getElementById('modal-food-name').innerText = SELECTED_FOOD.name;
            document.getElementById('modal-food-cal').innerText = SELECTED_FOOD.cal;
            document.getElementById('input-amount').value = 100;
            // Reset meal to default 'Phụ'
            selectMeal('meal-selector', 'Phụ'); 
            document.getElementById('modal-amount').classList.remove('hidden'); 
            document.getElementById('modal-amount').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('modal-amount').classList.add('hidden'); 
            document.getElementById('modal-amount').classList.remove('flex');
        }

        function selectMeal(containerId, meal) {
            if(containerId === 'meal-selector') SELECTED_MEAL = meal;
            else SELECTED_MANUAL_MEAL = meal;
            
            // Update UI
            document.querySelectorAll(`.meal-btn-${containerId}`).forEach(b => {
                if(b.innerText === meal) b.className = `meal-btn-${containerId} py-2.5 rounded-xl text-xs font-bold transition-all border-2 border-green-500 bg-green-50 text-green-700 shadow-sm`;
                else b.className = `meal-btn-${containerId} py-2.5 rounded-xl text-xs font-bold transition-all border-2 border-transparent bg-slate-50 text-slate-500 hover:bg-slate-100`;
            });
        }

        function adjAmount(v) {
            const inp = document.getElementById('input-amount');
            let val = parseInt(inp.value) || 0;
            if(val + v > 0) inp.value = val + v;
        }

        async function confirmAddFood() {
            const amt = document.getElementById('input-amount').value;
            if(!amt || amt<=0) return alert("Số lượng không hợp lệ");
            
            const ratio = amt / 100;
            const addedCal = Number(SELECTED_FOOD.cal) * ratio;

            // OPTIMISTIC UPDATE (Cập nhật ngay lập tức)
            DATA.cal += addedCal;
            DATA.pro += (Number(SELECTED_FOOD.pro) * ratio);
            DATA.carb += (Number(SELECTED_FOOD.carb) * ratio);
            DATA.fat += (Number(SELECTED_FOOD.fat) * ratio);
            DATA.list.push({name: SELECTED_FOOD.name, cal: addedCal, type: SELECTED_MEAL});
            
            localStorage.setItem(CACHE_KEY, JSON.stringify(DATA));
            renderStats(); 
            closeModal(); 
            showToast(`Đã thêm ${SELECTED_FOOD.name}`);
            document.getElementById('food-search').value = '';
            filterFoods(); // Reset list

            // Sync Server
            await callAPI('log_meal', { 
                userId: USER.id, name: SELECTED_FOOD.name, amount: Number(amt), 
                baseCal: SELECTED_FOOD.cal, basePro: SELECTED_FOOD.pro, 
                baseCarb: SELECTED_FOOD.carb, baseFat: SELECTED_FOOD.fat, 
                type: SELECTED_MEAL 
            });
            loadStats(); // Refresh correct data
        }

        async function addManualFood() {
            const name = document.getElementById('man-name').value;
            const cal = document.getElementById('man-cal').value;
            if(!name || !cal) return alert("Thiếu thông tin");
            
            DATA.cal += Number(cal);
            DATA.list.push({name: name, cal: Number(cal), type: SELECTED_MANUAL_MEAL});
            renderStats();
            showToast("Đã lưu bữa ăn!");

            await callAPI('log_meal', { userId: USER.id, name, cal: Number(cal), isManual: true, type: SELECTED_MANUAL_MEAL });
            document.getElementById('man-name').value=''; document.getElementById('man-cal').value='';
            switchInputMode('search');
            loadStats();
        }

        function switchInputMode(m) {
            document.getElementById('mode-search').className = m==='search' ? 'space-y-4 animate-in fade-in zoom-in-95 duration-300' : 'hidden';
            document.getElementById('mode-manual').className = m==='manual' ? 'bg-white p-6 rounded-3xl border border-slate-100 shadow-lg shadow-slate-100 space-y-5 relative animate-in fade-in zoom-in-95 duration-300' : 'hidden';
            
            const btnSearch = document.getElementById('tab-search');
            const btnManual = document.getElementById('tab-manual');
            
            if(m==='search') {
                btnSearch.className = "px-4 py-1.5 text-[11px] font-bold rounded-md active-tab transition-all";
                btnManual.className = "px-4 py-1.5 text-[11px] font-bold rounded-md text-slate-400 hover:text-slate-600 transition-all";
            } else {
                btnSearch.className = "px-4 py-1.5 text-[11px] font-bold rounded-md text-slate-400 hover:text-slate-600 transition-all";
                btnManual.className = "px-4 py-1.5 text-[11px] font-bold rounded-md active-tab transition-all";
            }
        }

        function animateValue(id, start, end, duration) {
            if (start === end) return;
            const range = end - start;
            let current = start;
            const increment = end > start ? 1 : -1;
            const stepTime = Math.abs(Math.floor(duration / range));
            const obj = document.getElementById(id);
            if(Math.abs(range) < 5) { obj.innerText = end; return; } 
            
            const timer = setInterval(function() {
                current += increment;
                obj.innerText = current;
                if ((increment > 0 && current >= end) || (increment < 0 && current <= end)) {
                    clearInterval(timer);
                    obj.innerText = end;
                }
            }, stepTime > 20 ? stepTime : 20);
        }
        
        // Render Bottom Nav
        renderBottomNav('nutrition');
    </script>
</body>
</html>
