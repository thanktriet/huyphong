<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - PT Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="PT Manager">
    <meta name="description" content="Ứng dụng quản lý PT chuyên nghiệp với theo dõi tập luyện, dinh dưỡng và thể trạng">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/mobile.css">
    <style>
        /* Ẩn thanh cuộn */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Mobile optimizations */
        @media (max-width: 640px) {
            body { padding-bottom: 5rem; }
            .max-w-md { max-width: 100%; padding: 0 1rem; }
        }
    </style>
</head>
<body class="bg-slate-50 pb-24 font-sans text-slate-800">

    <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg relative">
        
        <div class="p-6 bg-white sticky top-0 z-10 flex justify-between items-center border-b border-slate-50">
            <div>
                <h1 class="text-xl font-bold text-slate-900">Hi, <span id="userName">...</span> 👋</h1>
                <p class="text-slate-500 text-xs">Chúc bạn tập luyện hiệu quả!</p>
            </div>
            
            <a href="profile.html" class="block cursor-pointer transition-transform active:scale-95" title="Xem hồ sơ cá nhân">
                <div class="h-10 w-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-bold hover:bg-blue-200 hover:ring-2 ring-blue-100 transition-all" id="userAvatar">
                    U
                </div>
            </a>
        </div>

        <div class="p-6 space-y-6">
            
            <a href="admin.html" id="btnAdmin" class="hidden w-full bg-slate-900 text-white p-4 rounded-xl shadow-lg flex items-center justify-between group transition-all hover:bg-slate-800 mb-4">
                <div class="flex items-center gap-3">
                    <div class="bg-slate-800 p-2 rounded-lg group-hover:bg-slate-700 transition-colors">
                        <i data-lucide="shield-alert" class="text-yellow-400 w-6 h-6"></i>
                    </div>
                    <div class="text-left">
                        <h3 class="font-bold text-sm">Khu Vực Quản Trị</h3>
                        <p class="text-[10px] text-slate-400">Dành riêng cho PT</p>
                    </div>
                </div>
                <i data-lucide="chevron-right" class="text-slate-500"></i>
            </a>

            <div class="bg-gradient-to-br from-blue-600 to-indigo-600 text-white rounded-2xl p-6 shadow-lg shadow-blue-200 relative overflow-hidden">
                <i data-lucide="target" class="absolute right-[-10px] top-[-10px] w-24 h-24 text-white opacity-10 rotate-12"></i>
                <div id="packageInfo">
                    <p class="text-blue-100 text-sm font-medium relative z-10">Gói tập còn lại</p>
                    <h2 class="text-4xl font-bold relative z-10 mt-1"><span id="sessionLeft">0</span> <span class="text-lg font-normal opacity-80">buổi</span></h2>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <a href="workout.html" class="h-32 rounded-xl border-2 border-dashed border-slate-200 flex flex-col items-center justify-center gap-3 text-slate-600 hover:bg-blue-50 hover:border-blue-400 hover:text-blue-600 transition-all active:scale-95">
                    <div class="bg-blue-50 p-4 rounded-full"><i data-lucide="dumbbell" class="w-7 h-7 text-blue-500"></i></div>
                    <span class="font-bold text-base">Vào Tập</span>
                </a>
                <a href="nutrition.html" class="h-32 rounded-xl border-2 border-dashed border-slate-200 flex flex-col items-center justify-center gap-3 text-slate-600 hover:bg-green-50 hover:border-green-400 hover:text-green-600 transition-all active:scale-95">
                    <div class="bg-green-50 p-4 rounded-full"><i data-lucide="utensils" class="w-7 h-7 text-green-500"></i></div>
                    <span class="font-bold text-base">Nhập Ăn</span>
                </a>
            </div>
        </div>
    </div>

    <!-- PWA Install Button will be added here by js/pwa/install.js -->
    
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 safe-area-pb bottom-nav">
        <div class="max-w-md mx-auto flex justify-around items-center h-16 px-2">
            <a href="index.html" class="flex flex-col items-center justify-center w-full h-full text-blue-600 transition-colors active:bg-blue-50 rounded-lg">
                <i data-lucide="home" class="w-6 h-6 mb-0.5"></i>
                <span class="text-[10px] font-bold">Home</span>
            </a>
            <a href="workout.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600 transition-colors active:bg-slate-50 rounded-lg">
                <i data-lucide="dumbbell" class="w-6 h-6 mb-0.5"></i>
                <span class="text-[10px] font-medium">Tập</span>
            </a>
            <a href="nutrition.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600 transition-colors active:bg-slate-50 rounded-lg">
                <i data-lucide="utensils" class="w-6 h-6 mb-0.5"></i><span class="text-[10px] font-medium">Ăn</span>
            </a>
            <a href="schedule.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600 transition-colors active:bg-slate-50 rounded-lg">
                <i data-lucide="calendar" class="w-6 h-6 mb-0.5"></i><span class="text-[10px] font-medium">Lịch</span>
            </a>
            <button onclick="logout()" class="flex flex-col items-center justify-center w-full h-full text-red-400 hover:text-red-600 transition-colors active:bg-red-50 rounded-lg">
                <i data-lucide="log-out" class="w-6 h-6 mb-0.5"></i>
                <span class="text-[10px] font-medium">Thoát</span>
            </button>
        </div>
    </div>

    <!-- Load Core System -->
    <script src="js/core/config.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/api.js"></script>
    <!-- supabase/api.js will be loaded by API.init() -->
    <script src="js/services/auth.service.js"></script>
    <script src="js/ui/toast.js"></script>
    
    <!-- PWA Scripts -->
    <script src="js/pwa/register.js"></script>
    <script src="js/pwa/install.js"></script>
    <script src="js/pwa/sync.js"></script>
    <script src="js/pwa/notifications.js"></script>

    <script>
        lucide.createIcons();
        
        // Initialize - Wait for scripts to load
        (async function init() {
            try {
                // Wait for CONFIG to be available
                if (typeof CONFIG === 'undefined') {
                    await new Promise(resolve => {
                        const checkConfig = setInterval(() => {
                            if (typeof CONFIG !== 'undefined') {
                                clearInterval(checkConfig);
                                resolve();
                            }
                        }, 50);
                    });
                }
                
                // Initialize API (this will load supabase/api.js)
                await API.init();
                
                // Check auth
                if (!AuthService.isAuthenticated()) {
                    window.location.href = 'login.html';
                    return;
                }

            const user = AuthService.getCurrentUser();
            
            // Display user info
            document.getElementById('userName').innerText = user.name;
            document.getElementById('userAvatar').innerText = user.name.charAt(0).toUpperCase();
            
            // Package info
            const sessionEl = document.getElementById('sessionLeft');
            const packageInfo = document.getElementById('packageInfo');
            const today = new Date().toISOString().slice(0,10);

            let isMonthly = false;
            
            if (user.expiryDate && user.expiryDate !== '---') {
                const parts = user.expiryDate.split('/');
                if (parts.length === 3) {
                    const expiryIso = `${parts[2]}-${parts[1]}-${parts[0]}`;
                    if (expiryIso >= today) {
                        isMonthly = true;
                    }
                }
            }

            if (isMonthly) {
                packageInfo.innerHTML = `
                    <p class="text-blue-100 text-sm font-medium relative z-10">Trạng thái gói</p>
                    <h2 class="text-2xl font-bold relative z-10 mt-1">Gói Tháng</h2>
                    <div class="text-xs font-normal opacity-80 mt-1 flex items-center gap-1 relative z-10">
                        <i data-lucide="clock" class="w-3 h-3"></i> Hết hạn: ${user.expiryDate}
                    </div>`;
                lucide.createIcons();
            } else {
                sessionEl.innerText = user.sessionLeft || 0;
            }

            // Show admin button
            if (AuthService.isAdmin()) {
                document.getElementById('btnAdmin').classList.remove('hidden');
            }
            } catch (error) {
                console.error('Init error:', error);
                Toast.error('Lỗi khởi tạo: ' + error.message);
            }
        })();

        function logout() { 
            if(confirm('Bạn muốn đăng xuất?')) { 
                AuthService.logout();
            } 
        }
    </script>
</body>
</html>
