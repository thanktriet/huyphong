<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - PT Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Ẩn thanh cuộn */
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 pb-24 font-sans text-slate-800">

    <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg relative">
        
        <div class="p-6 bg-white sticky top-0 z-10 flex justify-between items-center border-b border-slate-50">
            <div>
                <h1 class="text-xl font-bold text-slate-900">Hi, <span id="userName">...</span> 👋</h1>
                <p class="text-slate-500 text-xs">Chúc bạn tập luyện hiệu quả!</p>
            </div>
            
            <a href="profile.html" class="block cursor-pointer transition-transform active:scale-95" title="Xem hồ sơ">
                <div class="h-10 w-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-bold hover:bg-blue-200 hover:ring-2 ring-blue-100 transition-all" id="userAvatar">
                    U
                </div>
            </a>
        </div>

        <div class="p-6 space-y-6">
            
            <a href="admin.html" id="btnAdmin" class="hidden w-full bg-slate-900 text-white p-4 rounded-xl shadow-lg flex items-center justify-between group transition-all hover:bg-slate-800 mb-4">
                <div class="flex items-center gap-3">
                    <div class="bg-slate-800 p-2 rounded-lg group-hover:bg-slate-700 transition-colors">
                        <i data-lucide="shield-alert" class="text-yellow-400 w-6 h-6"></i>
                    </div>
                    <div class="text-left">
                        <h3 class="font-bold text-sm">Khu Vực Quản Trị</h3>
                        <p class="text-[10px] text-slate-400">Dành riêng cho PT</p>
                    </div>
                </div>
                <i data-lucide="chevron-right" class="text-slate-500"></i>
            </a>

            <div class="bg-gradient-to-br from-blue-600 to-indigo-600 text-white rounded-2xl p-6 shadow-lg shadow-blue-200 relative overflow-hidden">
                <i data-lucide="target" class="absolute right-[-10px] top-[-10px] w-24 h-24 text-white opacity-10 rotate-12"></i>
                <p class="text-blue-100 text-sm font-medium relative z-10">Gói tập còn lại</p>
                <h2 class="text-4xl font-bold relative z-10 mt-1"><span id="sessionLeft">0</span> <span class="text-lg font-normal opacity-80">buổi</span></h2>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <a href="workout.html" class="h-28 rounded-xl border-2 border-dashed border-slate-200 flex flex-col items-center justify-center gap-2 text-slate-600 hover:bg-blue-50 hover:border-blue-400 hover:text-blue-600 transition-all">
                    <div class="bg-blue-50 p-3 rounded-full"><i data-lucide="dumbbell" class="w-6 h-6 text-blue-500"></i></div>
                    <span class="font-bold text-sm">Vào Tập</span>
                </a>
                <a href="nutrition.html" class="h-28 rounded-xl border-2 border-dashed border-slate-200 flex flex-col items-center justify-center gap-2 text-slate-600 hover:bg-green-50 hover:border-green-400 hover:text-green-600 transition-all">
                    <div class="bg-green-50 p-3 rounded-full"><i data-lucide="utensils" class="w-6 h-6 text-green-500"></i></div>
                    <span class="font-bold text-sm">Nhập Ăn</span>
                </a>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 safe-area-pb">
        <div class="max-w-md mx-auto flex justify-around items-center h-16">
            <a href="index.html" class="flex flex-col items-center justify-center w-full text-blue-600 transition-colors">
                <i data-lucide="home" class="w-6 h-6 mb-1"></i>
                <span class="text-[10px] font-bold">Home</span>
            </a>
            <a href="workout.html" class="flex flex-col items-center justify-center w-full text-slate-400 hover:text-slate-600 transition-colors">
                <i data-lucide="dumbbell" class="w-6 h-6 mb-1"></i>
                <span class="text-[10px] font-medium">Tập</span>
            </a>
            <a href="nutrition.html" class="flex flex-col items-center justify-center w-full text-slate-400 hover:text-slate-600 transition-colors">
                <i data-lucide="utensils" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Ăn</span>
            </a>
            <a href="schedule.html" class="flex flex-col items-center justify-center w-full text-slate-400 hover:text-slate-600 transition-colors">
                <i data-lucide="calendar" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Lịch</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center justify-center w-full text-slate-400 hover:text-slate-600 transition-colors">
                <i data-lucide="user" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-medium">Tôi</span>
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        // 1. Kiểm tra đăng nhập
        const userJson = localStorage.getItem('pt_user');
        if (!userJson) {
            window.location.href = 'login.html';
        } else {
            const user = JSON.parse(userJson);
            
            // 2. Hiển thị thông tin cơ bản
            document.getElementById('userName').innerText = user.name;
            document.getElementById('userAvatar').innerText = user.name.charAt(0);
            
            // Logic hiển thị gói tập (Buổi hoặc Tháng)
            const sessionEl = document.getElementById('sessionLeft');
            const today = new Date().toISOString().slice(0,10);

            if (user.expiryDate && user.expiryDate !== '---' && user.expiryDate >= today) {
                // Nếu là gói tháng và còn hạn
                // Định dạng lại ngày cho đẹp (YYYY-MM-DD -> DD/MM/YYYY)
                const parts = user.expiryDate.split('-');
                const niceDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
                
                sessionEl.parentElement.innerHTML = `
                    <span class="text-2xl font-bold">Gói Tháng</span>
                    <div class="text-xs font-normal opacity-80 mt-1 flex items-center gap-1">
                        <i data-lucide="clock" class="w-3 h-3"></i> Hết hạn: ${niceDate}
                    </div>`;
                lucide.createIcons();
            } else {
                // Nếu là gói buổi
                sessionEl.innerText = user.sessionLeft || 0;
            }

            // 3. LOGIC HIỆN NÚT ADMIN
            if (user.role === 'PT' || user.role === 'Admin') {
                document.getElementById('btnAdmin').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
