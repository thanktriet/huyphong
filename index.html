<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./js/config.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/layout.js"></script>
</head>
<body class="bg-slate-50 pb-24">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg relative">
        <div id="header-area" class="p-6 bg-white sticky top-0 z-10"></div>

        <div class="px-6 space-y-6">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-600 text-white rounded-2xl p-6 shadow-lg">
                <p class="text-blue-100 text-sm font-medium">Gói tập còn lại</p>
                <h2 class="text-4xl font-bold"><span id="sessionLeft">...</span> <span class="text-lg font-normal opacity-80">buổi</span></h2>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <a href="workout.html" class="h-24 rounded-xl border-2 border-dashed border-slate-200 flex flex-col items-center justify-center gap-2 text-slate-600 hover:bg-blue-50 hover:border-blue-300">
                    <span class="text-2xl">💪</span> <span class="font-semibold text-sm">Vào Tập</span>
                </a>
                <a href="nutrition.html" class="h-24 rounded-xl border-2 border-dashed border-slate-200 flex flex-col items-center justify-center gap-2 text-slate-600 hover:bg-green-50 hover:border-green-300">
                    <span class="text-2xl">🥗</span> <span class="font-semibold text-sm">Nhập Ăn</span>
                </a>
            </div>
        </div>
    </div>

<script>
    // 1. Kiểm tra xem file layout.js có được nạp không
    if (typeof renderLayout === "function") {
        renderLayout('home'); // Vẽ menu
    } else {
        alert("Lỗi: Không tìm thấy file js/layout.js. Hãy kiểm tra lại thư mục!");
    }

    // 2. Hiển thị số buổi (chỉ chạy khi có USER)
    // Lưu ý: auth.js dùng const USER, nên ta dùng trực tiếp biến USER thay vì window.USER
    if (typeof USER !== 'undefined' && USER) {
        const sessionEl = document.getElementById('sessionLeft');
        if (sessionEl) {
            sessionEl.innerText = USER.sessionLeft || 0;
        }
    }
</script>
</body>
</html>
