<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 pb-24">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg relative">
        <div class="p-6 bg-white sticky top-0 z-10 flex justify-between items-center border-b border-slate-50">
            <div>
                <h1 class="text-xl font-bold text-slate-900">Hi, <span id="userName">...</span> 👋</h1>
                <p class="text-slate-500 text-xs">Chúc bạn tập luyện hiệu quả!</p>
            </div>
            <div class="h-10 w-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-bold" id="userAvatar">U</div>
        </div>

        <div class="p-6 space-y-6">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-600 text-white rounded-2xl p-6 shadow-lg">
                <p class="text-blue-100 text-sm font-medium">Gói tập còn lại</p>
                <h2 class="text-4xl font-bold"><span id="sessionLeft">0</span> <span class="text-lg font-normal opacity-80">buổi</span></h2>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <a href="workout.html" class="h-28 rounded-xl border-2 border-dashed border-slate-200 flex flex-col items-center justify-center gap-2 text-slate-600 hover:bg-blue-50 hover:border-blue-400 transition-all">
                    <i data-lucide="dumbbell" class="w-8 h-8 text-blue-500"></i>
                    <span class="font-bold text-sm">Vào Tập</span>
                </a>
                <a href="nutrition.html" class="h-28 rounded-xl border-2 border-dashed border-slate-200 flex flex-col items-center justify-center gap-2 text-slate-600 hover:bg-green-50 hover:border-green-400 transition-all">
                    <i data-lucide="utensils" class="w-8 h-8 text-green-500"></i>
                    <span class="font-bold text-sm">Nhập Ăn</span>
                </a>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 safe-area-pb">
        <div class="max-w-md mx-auto flex justify-around items-center h-16">
            <a href="index.html" class="flex flex-col items-center justify-center w-full text-blue-600"><i data-lucide="home" class="w-6 h-6"></i><span class="text-[10px] font-bold">Home</span></a>
            <a href="workout.html" class="flex flex-col items-center justify-center w-full text-slate-400"><i data-lucide="dumbbell" class="w-6 h-6"></i><span class="text-[10px]">Tập</span></a>
            <a href="nutrition.html" class="flex flex-col items-center justify-center w-full text-slate-400"><i data-lucide="utensils" class="w-6 h-6"></i><span class="text-[10px]">Ăn</span></a>
            <a href="schedule.html" class="flex flex-col items-center justify-center w-full text-slate-400"><i data-lucide="calendar" class="w-6 h-6"></i><span class="text-[10px]">Lịch</span></a>
            <button onclick="logout()" class="flex flex-col items-center justify-center w-full text-red-400"><i data-lucide="log-out" class="w-6 h-6"></i><span class="text-[10px]">Thoát</span></button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const userJson = localStorage.getItem('pt_user');
        if (!userJson) window.location.href = 'login.html';
        const user = JSON.parse(userJson);
        document.getElementById('userName').innerText = user.name;
        document.getElementById('userAvatar').innerText = user.name.charAt(0);
        document.getElementById('sessionLeft').innerText = user.sessionLeft || 0;

        function logout() { if(confirm('Đăng xuất?')) { localStorage.removeItem('pt_user'); window.location.href='login.html'; } }
    </script>
</body>
</html>
